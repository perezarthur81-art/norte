    '<div class="guar"><svg class="seal" viewBox="0 0 132 132" role="img" aria-label="' + T.sealAria + '"><circle cx="66" cy="66" r="64" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="66" cy="66" r="60" fill="none" stroke="currentColor" stroke-width=".8"/><circle cx="66" cy="66" r="41" fill="none" stroke="currentColor" stroke-width=".8"/><path id="seal-path" d="M66 66m-47 0a47 47 0 1 1 94 0a47 47 0 1 1-94 0" fill="none"/><text class="seal__ring"><textPath href="#seal-path" textLength="290" lengthAdjust="spacing">' + T.sealRing + '</textPath></text><text class="seal__num" x="66" y="76" text-anchor="middle">15</text><text class="seal__unit" x="67" y="91" text-anchor="middle">' + T.sealUnit + '</text></svg>' +
    '<div><h3>' + T.guarH + '</h3><p>' + T.guarP + '</p></div></div>' +
    '</div></section>';

  h += '<section class="sec sec--tint" id="preguntas"><div class="wrap faqs"><div class="sec__head"><p class="serial">' + T.faqSerial + '</p><h2>' + T.faqH + '</h2></div>' +
    '<div class="faq">' + T.faq.map(function (q) { return '<details><summary><h3>' + q[0] + '</h3></summary><div class="ans">' + fill(q[1]) + contact(q[2]) + '</div></details>'; }).join('') + '</div></div></section>';

  h += '<section class="end"><div class="wrap"><p class="serial">' + T.endSerial + '</p><h2>' + T.endH + '</h2><p>' + T.endP + '</p>' +
    '<div class="cta-row">' + buyBtn(C, 'btn--paper') + (CHECKOUT ? '<a class="btn btn--ghost" href="' + APP_URL + '">' + C.openApp + '</a>' : '') + '</div></div></section>';

  return h + '</main>' + footer(C);
}
mount(body);
})();
</script>
</body>
</html>
