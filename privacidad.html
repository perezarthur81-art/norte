function setMeta(sel, v) { var m = document.querySelector(sel); if (m) m.setAttribute('content', v); }
function setHead(T) {

function mount(renderBody) {

    var b = e.target.closest ? e.target.closest('.langs [data-lang]') : null;
    if (!b) return;
    var l = b.getAttribute('data-lang');
    if (!okLang(l) || l === lang) return;
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (err) {}
    try { var u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (err) {}
    draw(true);

      '</ul>' },
    { id: 'responsable', h: 'Quién responde por esta política', html:

    { id: 'datos-app', h: 'Los datos que guardas en Norte', html:

      '<p>La protección de estos datos depende de tu dispositivo: cualquier persona que pueda desbloquearlo y abrir tu navegador puede ver lo que guardaste en Norte.</p>' },
    { id: 'compra', h: 'Lo que recibimos cuando compras Pro', html:
      '<p>El pago de Pro se hace por Hotmart, que es quien cobra y procesa la compra. De Hotmart recibimos:</p>' +

    { id: 'cookies', h: 'Cookies, analítica y terceros', html:
      '<p>Norte no usa cookies, herramientas de analítica, anuncios ni rastreadores. La app no hace peticiones a servicios de terceros: las tipografías y los demás archivos se sirven junto con la propia app.</p>' +
      '<p>Este sitio guarda en tu navegador una sola preferencia, el idioma que elegiste, para mostrarte las páginas en ese idioma. No es una cookie y no se envía a ningún servidor.</p>' +
      '<p>Como ocurre con cualquier sitio web, el servicio de alojamiento que entrega los archivos de Norte puede registrar datos técnicos de la conexión, como la dirección IP y la fecha, para funcionar y protegerse. No usamos esos registros para identificarte ni para seguir lo que haces.</p>' },

en: {
  title: 'Privacy | Norte',
  desc: 'Norte privacy policy: your financial data is stored only on your device. No accounts, no cookies, no analytics and no ads.',
  serial: 'Norte · Arthur Labs',
  h1: 'Privacy policy',
  intro: 'Written in plain language. It explains what data exists when you use Norte, where it lives, and what Arthur Labs receives if you buy Pro.',
  updated: 'Last updated: November 12, 2026.',
  tocH: 'Contents',
  sections: [
    { id: 'resumen', h: 'In short', html:
      '<ul class="key">' +
      '<li>Your financial data is stored only on your device. Arthur Labs does not receive it and cannot see it.</li>' +
      '<li>There are no user accounts, no bank connection and no bank passwords.</li>' +
      '<li>We use no cookies, analytics, ads or trackers, and the app makes no third-party requests.</li>' +
      '<li>If you buy Pro, Hotmart gives us your name, your email and the status of your purchase. Never your card details.</li>' +
      '<li>Backups are up to you.</li>' +
      '</ul>' },
    { id: 'responsable', h: 'Who is responsible for this policy', html:
      '<p>Norte is a product of Arthur Labs, based in Santo Domingo, Dominican Republic. In this text, “we” means Arthur Labs and “Norte” means the web app and this site.</p>' },
    { id: 'datos-app', h: 'The data you keep in Norte', html:
      '<p>Everything you enter in the app (income, expenses, budgets, goals, debts, savings circles, loans, net worth and your preferences, such as language and currency) is stored in the browser storage of your own device.</p>' +
      '<p>That data is not sent to Arthur Labs. We have no copy of it, we cannot see it, and we cannot recover it for you.</p>' +
      '<p>If you dictate a transaction with the voice feature of your keyboard or your browser, that speech recognition is done by your device or by your browser provider, not by Norte.</p>' +
      '<p>The protection of this data depends on your device: anyone who can unlock it and open your browser can see what you saved in Norte.</p>' },
    { id: 'compra', h: 'What we receive when you buy Pro', html:
      '<p>Pro is paid for through Hotmart, which charges and processes the purchase. From Hotmart we receive:</p>' +
      '<ul><li>your name,</li><li>your email address,</li><li>the status of your purchase (for example, approved or refunded).</li></ul>' +
      '<p>We never receive your card or payment method details.</p>' +
      '<p>We use that data to send you your activation key, answer your questions and handle refunds. We keep it for as long as needed to support your license and meet our legal obligations. We do not sell it or use it for advertising.</p>' +
      '<p>How Hotmart handles your data is governed by Hotmart’s own privacy policy.</p>' },
    { id: 'cookies', h: 'Cookies, analytics and third parties', html:
      '<p>Norte uses no cookies, analytics tools, ads or trackers. The app makes no requests to third-party services: the fonts and all other files are served together with the app itself.</p>' +
      '<p>This site stores a single preference in your browser, the language you chose, so that pages are shown in that language. It is not a cookie and it is not sent to any server.</p>' +
      '<p>As with any website, the hosting service that delivers the Norte files may record technical connection data, such as IP address and date, in order to operate and protect itself. We do not use those records to identify you or to follow what you do.</p>' },
    { id: 'copias', h: 'Backups', html:
      '<p>You can download a backup file from the app and restore it later, on the same device or on another one. That file contains your financial data: keep it somewhere safe and treat it as a private document.</p>' +
      '<p>Making backups is your responsibility. If you clear your browser data, uninstall the app or lose the device without having a backup, your data is lost and we cannot recover it.</p>' },
    { id: 'control', h: 'Your control over your data', html:
      '<p>The app data is in your hands: you can view it, correct it, export it with a backup and delete it whenever you like, from the app itself or by clearing your browser data.</p>' +
      '<p>For your purchase data (name, email and status), you can ask us to tell you what we hold, to correct it, or to delete it once it is no longer needed.</p>' },
    { id: 'cambios', h: 'Changes to this policy', html:
      '<p>If this policy changes, we will publish the new version here with its date. If Norte ever adds a feature that sends data outside your device, we will explain it on this page before it becomes available.</p>' },
    { id: 'contacto', h: 'Contact', html:
      '<p>Arthur Labs · Santo Domingo, Dominican Republic.</p>',
      contact: 'For any privacy question, write to us at {email}. If you write to us, we use your address and your message only to reply to you.' },
    { id: 'idioma', h: 'Language', html:
      '<p>This policy is available in Spanish, English and French. If there is any discrepancy between versions, the Spanish version prevails.</p>' }
  ]
},

      '<p>Le traitement de vos données par Hotmart est régi par la politique de confidentialité de Hotmart.</p>' },
    { id: 'cookies', h: 'Cookies, mesure d’audience et tiers', html:
      '<p>Norte n’utilise ni cookies, ni outils de mesure d’audience, ni publicité, ni traceurs. L’appli n’envoie aucune requête à des services tiers : les polices et tous les autres fichiers sont servis avec l’appli elle-même.</p>' +
      '<p>Ce site enregistre une seule préférence dans votre navigateur, la langue que vous avez choisie, afin d’afficher les pages dans cette langue. Ce n’est pas un cookie et elle n’est envoyée à aucun serveur.</p>' +
      '<p>Comme pour tout site web, le service d’hébergement qui délivre les fichiers de Norte peut enregistrer des données techniques de connexion, comme l’adresse IP et la date, afin de fonctionner et de se protéger. Nous n’utilisons pas ces journaux pour vous identifier ni pour suivre ce que vous faites.</p>' },
    { id: 'copias', h: 'Sauvegardes', html:
      '<p>Vous pouvez télécharger un fichier de sauvegarde depuis l’appli et le restaurer plus tard, sur le même appareil ou sur un autre. Ce fichier contient vos données financières : conservez-le en lieu sûr et traitez-le comme un document privé.</p>' +
      '<p>Faire des sauvegardes relève de votre responsabilité. Si vous effacez les données du navigateur, désinstallez l’appli ou perdez l’appareil sans avoir de sauvegarde, vos données sont perdues et nous ne pouvons pas les récupérer.</p>' },
    { id: 'control', h: 'Votre contrôle sur vos données', html:
      '<p>Les données de l’appli sont entre vos mains : vous pouvez les consulter, les corriger, les exporter avec une sauvegarde et les supprimer quand vous voulez, depuis l’appli elle-même ou en effaçant les données du navigateur.</p>' +
      '<p>Pour les données de votre achat (nom, e-mail et état), vous pouvez nous demander lesquelles nous détenons, de les corriger ou de les supprimer lorsqu’elles ne sont plus nécessaires.</p>' },
    { id: 'cambios', h: 'Modifications de cette politique', html:
      '<p>Si cette politique change, nous publierons ici la nouvelle version avec sa date. Si Norte ajoute un jour une fonction qui envoie des données hors de votre appareil, nous l’expliquerons sur cette page avant qu’elle soit disponible.</p>' },
    { id: 'contacto', h: 'Contact', html:
      '<p>Arthur Labs · Saint-Domingue, République dominicaine.</p>',

    { id: 'idioma', h: 'Langue', html:
      '<p>Cette politique est disponible en espagnol, en anglais et en français. En cas de divergence entre les versions, la version espagnole prévaut.</p>' }
  ]
}

/* ── Render de página legal ── */
function legalBody() {
  var T = I18N[lang], C = COMMON[lang];
  setHead(T);
  var toc = T.sections.map(function (s) { return '<li><a href="#' + s.id + '">' + s.h + '</a></li>'; }).join('');
  var secs = T.sections.map(function (s, i) {
    return '<section id="' + s.id + '"><h2><span class="num" aria-hidden="true">' + (i < 9 ? '0' : '') + (i + 1) + '</span>' + s.h + '</h2>' + fill(s.html) + contact(s.contact) + '</section>';
  }).join('');
  return header(C, '') + '<main id="main" class="legal"><div class="wrap">' +
    '<div class="legal__head"><p class="serial">' + T.serial + '</p><h1>' + T.h1 + '</h1><p>' + T.intro + '</p><p class="legal__meta">' + T.updated + '</p></div>' +
    '<div class="legal__grid"><nav class="toc" aria-label="' + T.tocH + '"><h2>' + T.tocH + '</h2><ol>' + toc + '</ol></nav><div class="doc">' + secs + '</div></div>' +
    '</div></main>' + footer(C);
}
mount(legalBody);
})();
</script>
