:root{
  --paper:#F3F0E6; --surface:#FFFDF7; --surface-2:#E9E5D6; --surface-3:#DDD8C5;
  --ink:#14231F; --ink-2:#43524C; --ink-3:#5A655F; --line:#D5CFBB; --line-strong:#8A9388;
  --billete:#0B5E4E; --billete-ink:#084638; --billete-soft:#D5E8DF;
  --bill-bg:#0B5E4E; --bill-bg-2:#073F35; --bill-ink:#F1F6EC; --bill-foil:#E3C777; --bill-line:rgba(241,246,236,.16);
  --bill-over:#7C1F3A; --bill-over-2:#5E1529;
  --sello:#9C1F3F; --sello-soft:#F5DCDF; --oro:#7A5A0E; --oro-soft:#F1E4BE; --oro-foil:#C9A14A; --aviso:#A8400C; --aviso-soft:#FBE3D2; --dato:#2F5D73;
  --ok:#0B5E4E; --focus:#1F6FEB; --on-billete:#FFFFFF; --on-oro:#FFFFFF;
  /* seis tonos de identidad para gráficos y grupos (sin morados ni índigos) */
  --c1:#0B5E4E; --c2:#2F5D73; --c3:#7A5A0E; --c4:#9C1F3F; --c5:#5E7F3B; --c6:#8A6F9B;
  /* grupos del presupuesto: cada uno usa un tono de identidad o su matiz claro */
  --g-esenciales:var(--c2); --g-deudas:var(--c4); --g-familia:var(--c5); --g-pareja:var(--c6);
  --g-personal:color-mix(in srgb,var(--c2) 55%,var(--surface)); --g-diversion:color-mix(in srgb,var(--c5) 55%,var(--surface)); --g-hobbies:color-mix(in srgb,var(--c6) 55%,var(--surface));
  --g-emergencia:var(--c3); --g-ahorro:var(--c1); --g-inversion:color-mix(in srgb,var(--c1) 55%,var(--surface));
  /* radios: 4 etiquetas, 10 controles, 14 paneles, 22 billete y hojas, 999 píldoras */
  --r-xs:4px; --r-s:10px; --r-m:14px; --r-l:22px; --r-pill:999px;
  /* elevación: 0 plano con líneas finas, 1 panel, 2 billete, hojas y botón + */
  --e1:0 1px 0 var(--line),0 1px 2px rgba(20,35,31,.04); --e2:0 10px 30px -12px rgba(7,63,53,.45);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow-sheet:0 -8px 40px rgba(10,30,26,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --paper:#0B1412; --surface:#121E1B; --surface-2:#1A2925; --surface-3:#24362F;
  --ink:#E8EDE6; --ink-2:#AEBBB3; --ink-3:#8CA097; --line:#2B3D37; --line-strong:#5F7269;
  --billete:#45BFA2; --billete-ink:#86D8C3; --billete-soft:#123329;
  --bill-bg:#0E5446; --bill-bg-2:#0B3D33; --bill-ink:#F1F6EC; --bill-foil:#E3C777; --bill-line:rgba(241,246,236,.13);
  --bill-over:#6E1B34; --bill-over-2:#4F1225;
  --sello:#F0708C; --sello-soft:#3A1922; --oro:#E3B55C; --oro-soft:#30270F; --oro-foil:#C9A14A; --aviso:#F58B4C; --aviso-soft:#3A2012; --dato:#7FB2CC;
  --ok:#45BFA2; --focus:#6EA8FF; --on-billete:#04211B; --on-oro:#241800;
  --c1:#45BFA2; --c2:#7FB2CC; --c3:#E3B55C; --c4:#F0708C; --c5:#9BBF6E; --c6:#B9A3C7;
  --e1:none; --e2:0 10px 30px -12px rgba(0,0,0,.6); --shadow-sheet:0 -8px 40px rgba(0,0,0,.5);
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1412; --surface:#121E1B; --surface-2:#1A2925; --surface-3:#24362F;
  --ink:#E8EDE6; --ink-2:#AEBBB3; --ink-3:#8CA097; --line:#2B3D37; --line-strong:#5F7269;
  --billete:#45BFA2; --billete-ink:#86D8C3; --billete-soft:#123329;
  --bill-bg:#0E5446; --bill-bg-2:#0B3D33; --bill-ink:#F1F6EC; --bill-foil:#E3C777; --bill-line:rgba(241,246,236,.13);
  --bill-over:#6E1B34; --bill-over-2:#4F1225;
  --sello:#F0708C; --sello-soft:#3A1922; --oro:#E3B55C; --oro-soft:#30270F; --oro-foil:#C9A14A; --aviso:#F58B4C; --aviso-soft:#3A2012; --dato:#7FB2CC;
  --ok:#45BFA2; --focus:#6EA8FF; --on-billete:#04211B; --on-oro:#241800;
  --c1:#45BFA2; --c2:#7FB2CC; --c3:#E3B55C; --c4:#F0708C; --c5:#9BBF6E; --c6:#B9A3C7;
  --e1:none; --e2:0 10px 30px -12px rgba(0,0,0,.6); --shadow-sheet:0 -8px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body.modal-open{overflow:hidden}
body{overflow-wrap:break-word}
h1,h2,h3,p,li,b,span,a,label,.tile,.msg,.notice,.empty{overflow-wrap:anywhere}
td,th,td *,th *{overflow-wrap:break-word}
.num,.price,.v,.amt,.btn,.chip,.badge,.pro-tag,.plan-pill{overflow-wrap:normal}
.skip{position:fixed;left:.6rem;top:-4rem;z-index:100;background:var(--billete);color:var(--on-billete);border:0;border-radius:var(--r-s);padding:.6rem .9rem;font-weight:700}
.skip:focus{top:.6rem}
.discard-bar{margin:0 0 .9rem}
@media (pointer:coarse){.btn.small{min-height:44px}.iconbtn{width:44px;height:44px}.chip{min-height:44px}.linkbtn{display:inline-block;padding:.6rem 0}}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.95rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--billete)}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.875rem} .tiny{font-size:.8rem}
.pos{color:var(--ok)} .neg{color:var(--sello)} .warn{color:var(--aviso)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:.75rem} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack>*+*{margin-top:1rem} .stack-s>*+*{margin-top:.5rem} .stack-l>*+*{margin-top:1.75rem}
.between{justify-content:space-between}

/* ---------- Shell ---------- */
.shell{min-height:100%;display:block}
.sidebar{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.5rem;font-family:var(--f-display);font-weight:750;font-size:1.15rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand-mark{width:26px;height:26px;flex:none}
.topbar .view-title{font-family:var(--f-display);font-weight:600;color:var(--ink-2);font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-pill{margin-left:auto;white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.2rem .7rem;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.plan-pill.pro{border-color:var(--oro);color:var(--oro);background:var(--oro-soft)}
.main{max-width:1120px;margin:0 auto;padding:1.1rem 1rem 7rem;outline:none}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .45rem;font-size:.72rem;color:var(--ink-3);text-decoration:none}
.bottomnav a svg{width:22px;height:22px}
.bottomnav a[aria-current="page"]{color:var(--billete);font-weight:700}
.fab{position:fixed;right:1rem;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--billete);color:var(--on-billete);font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(13,106,88,.35);display:grid;place-items:center}
.fab:active{transform:scale(.96)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .sidebar{display:flex;flex-direction:column;gap:.25rem;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:1.1rem .8rem;border-right:1px solid var(--line);background:var(--surface)}
  .sidebar .brand{padding:.2rem .6rem 1rem}
  .sidebar nav a{display:flex;align-items:center;gap:.65rem;padding:.5rem .6rem;border-radius:var(--r-s);color:var(--ink-2);text-decoration:none;font-size:.95rem}
  .sidebar nav a svg{width:19px;height:19px;flex:none}
  .sidebar nav a:hover{background:var(--surface-2);color:var(--ink)}
  .sidebar nav a[aria-current="page"]{background:var(--billete-soft);color:var(--billete-ink);font-weight:700}
  .sidebar .nav-sep{height:1px;background:var(--line);margin:.6rem .4rem}
  .sidebar .side-foot{margin-top:auto;padding:.8rem .6rem 0;font-size:.85rem}
  .bottomnav{display:none}
  .topbar .brand{display:none}
  .fab{bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));right:1.5rem}
  .main{padding:1.6rem 2rem 6rem}
  h1{font-size:2.2rem}
}
.pro-tag{font-size:.68rem;font-weight:700;color:var(--oro);border:1px solid currentColor;border-radius:4px;padding:0 .3rem;margin-left:auto;line-height:1.4}

/* ---------- Surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:1rem 1.1rem}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:baseline;gap:.75rem;justify-content:space-between;margin-bottom:.8rem}
.panel-h h2,.panel-h h3{margin:0}
.grid{display:grid;gap:1rem}
@media (min-width:720px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.side{grid-template-columns:1.4fr 1fr}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.page-h p{color:var(--ink-2);max-width:62ch;margin-top:.25rem}
.hr{height:1px;background:var(--line);margin:1rem 0;border:0}

/* ---------- Bill (hero) ---------- */
.bill{position:relative;overflow:hidden;border-radius:var(--r-l);background:linear-gradient(135deg,var(--bill-bg),var(--bill-bg-2));color:var(--bill-ink);padding:1.25rem 1.3rem 1.2rem;min-height:196px;isolation:isolate}
.bill.over{background:linear-gradient(135deg,var(--bill-over),var(--bill-over-2))}
.bill-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1;stroke:var(--bill-line);fill:none;stroke-width:1}
.bill-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-size:.9rem;opacity:.9}
.bill-amount{font-family:var(--f-display);font-weight:760;font-size:clamp(2.5rem,11vw,3.9rem);line-height:1;letter-spacing:-.035em;margin:.55rem 0 .5rem;font-variant-numeric:tabular-nums}
.bill-note{max-width:44ch;font-size:.95rem;opacity:.92}
.bill-foot{display:flex;gap:.3rem 1.2rem;flex-wrap:wrap;margin-top:.9rem;font-size:.85rem;opacity:.88}
.bill-foot b{font-weight:700}
.bill-seal{position:absolute;right:1rem;bottom:1rem;width:74px;height:74px}
.bill-seal text{fill:var(--bill-ink);font-family:var(--f-display);font-weight:700}
@media (max-width:420px){.bill-seal{width:60px;height:60px;right:.8rem;bottom:.8rem}}

/* ---------- Stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.stats>div{background:var(--surface);padding:.8rem .95rem}
.stats .k{font-size:.82rem;color:var(--ink-2)}
.stats .v{font-family:var(--f-display);font-weight:680;font-size:1.3rem;letter-spacing:-.02em;margin-top:.1rem}
.stats .s{font-size:.78rem;color:var(--ink-3)}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:var(--r-s);border:1px solid transparent;padding:.6rem 1rem;font-weight:700;cursor:pointer;text-decoration:none;min-height:42px;font-size:.95rem;background:var(--billete);color:var(--on-billete)}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.soft{background:var(--billete-soft);color:var(--billete-ink)}
.btn.danger{background:transparent;color:var(--sello);border-color:color-mix(in srgb,var(--sello) 40%,transparent)}
.btn.gold{background:var(--oro);color:var(--on-oro)}
.btn.small{min-height:34px;padding:.35rem .7rem;font-size:.85rem}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--billete);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:var(--r-s);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}

/* ---------- Forms ---------- */
.field{display:block}
.field>span:not(.hint){display:block;font-size:.85rem;color:var(--ink-2);margin-bottom:.3rem;font-weight:700}
/* iPhone: el campo de fecha trae un ancho mínimo propio y se salía de la pantalla */
input.input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block}
input.input[type=date]::-webkit-date-and-time-value{text-align:left}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:.6rem .7rem;min-height:44px;font-size:1rem}
.input:focus{border-color:var(--billete);outline:2px solid color-mix(in srgb,var(--billete) 30%,transparent);outline-offset:0}
.input.big{font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:-.02em;padding:.4rem .7rem}
.hint{display:block;font-size:.8rem;color:var(--ink-3);margin-top:.3rem;font-weight:400}
.fields{display:grid;gap:.85rem}
@media (min-width:560px){.fields.two{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:.1rem;accent-color:var(--billete);flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-s);padding:3px;gap:3px}
.seg label{flex:1;text-align:center;cursor:pointer;border-radius:4px;padding:.45rem .3rem;font-weight:700;font-size:.92rem;color:var(--ink-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus)}
.seg .lang-btn{flex:1;border:0;background:none;cursor:pointer;border-radius:4px;padding:.45rem .3rem;font-weight:700;font-size:.92rem;color:var(--ink-2);min-height:40px}
.seg .lang-btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .75rem;font-size:.85rem;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:.35rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.static{cursor:default;min-height:32px}
.chip.guess{border-style:dashed;border-color:var(--aviso);background:var(--aviso-soft);color:var(--ink)}
.chip.count{background:var(--surface-2,var(--paper));font-variant-numeric:tabular-nums}
.imp-step{color:var(--ink-3)}
.imp-prev{font-size:.8rem;white-space:nowrap}
.imp-prev td,.imp-prev th{padding:.3rem .5rem;max-width:14rem;overflow:hidden;text-overflow:ellipsis}
.imp-prev tr.hd td{background:var(--billete-soft);color:var(--billete-ink);font-weight:700}
.imp-prev th.c{color:var(--ink-3);font-weight:600}
.imp-list li.imp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:.1rem .6rem;padding-inline:0}
.imp-list .imp-inc{width:22px;height:22px;margin-top:.15rem;flex:none;accent-color:var(--billete)}
.imp-list .t{overflow-wrap:anywhere}
.imp-ctl{grid-column:2/-1;display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr);gap:.4rem;margin-top:.4rem}
.imp-ctl .input{padding:.35rem .5rem;font-size:.85rem;min-height:38px;min-width:0;width:100%}
.imp-ctl .input.guess{border-style:dashed;border-color:var(--aviso)}
.imp-sample li{padding-inline:0}
.san-cal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.4rem}
.san-cal li{display:grid;grid-template-columns:1.6rem 1fr;gap:0 .4rem;align-items:baseline;padding:.4rem .55rem;border:1px solid var(--line);border-radius:var(--r-s);font-size:.85rem;background:var(--surface)}
.san-cal li .tiny{grid-column:2;color:var(--ink-3);min-height:1em}
.san-cal li.ok{background:var(--billete-soft);border-color:transparent;color:var(--billete-ink)} .san-cal li.ok .tiny{color:var(--billete-ink)}
.san-cal li.me{border-color:var(--oro);box-shadow:inset 0 0 0 1px var(--oro)}
.quick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:end;padding-bottom:.2rem}
.quick .field{min-width:0}
.quick-out{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.quick-out:empty{display:none}
.quick-msg{flex-basis:100%;margin:0}
.iconbtn.mic{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--billete)}
.iconbtn.mic[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* ---------- Progress ---------- */
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--billete);max-width:100%}
.bar.warn>i{background:var(--aviso)} .bar.over>i{background:var(--sello)} .bar.gold>i{background:var(--oro)}
.bar.thin{height:5px}

/* ---------- Lists ---------- */
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .s{font-size:.82rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .amt{font-family:var(--f-display);font-weight:680;white-space:nowrap;text-align:right}
.list button.rowbtn{all:unset;display:flex;align-items:center;gap:.75rem;width:100%;cursor:pointer}
.list button.rowbtn:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.day-h{padding:.55rem 1rem;background:var(--surface-2);font-size:.8rem;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between}
.badge{font-size:.72rem;font-weight:700;border-radius:4px;padding:.05rem .35rem;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.gold{background:var(--oro-soft);color:var(--oro)} .badge.red{background:var(--sello-soft);color:var(--sello)} .badge.green{background:var(--billete-soft);color:var(--billete-ink)} .badge.amber{background:var(--aviso-soft);color:var(--aviso)}

/* ---------- Budget table ---------- */
.bgroup{border-top:1px solid var(--line)}
.bgroup:first-child{border-top:0}
.bgroup-h{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.bgroup-h h3{font-size:1rem}
.bgroup-h .gsum{margin-left:auto;font-size:.85rem;color:var(--ink-2);text-align:right}
.bcat{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;padding:.65rem 1rem .75rem 2.1rem;border-top:1px dashed var(--line)}
.bcat .nm{font-weight:700;display:flex;align-items:center;gap:.4rem;min-width:0}
.bcat .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcat .meta{font-size:.8rem;color:var(--ink-3);grid-column:1/-1;display:flex;justify-content:space-between;gap:.5rem}
.bcat .bar{grid-column:1/-1}
.inline-amt{width:118px;text-align:right;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-s);padding:.3rem .5rem;font-variant-numeric:tabular-nums;font-weight:700;min-height:36px}
.inline-amt:focus{background:var(--surface);border-color:var(--billete);outline:none}
.assign{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 1rem;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.assign.zero{border-color:var(--billete);background:var(--billete-soft)}
.assign.over{border-color:var(--sello);background:var(--sello-soft)}
.assign.left{border-color:var(--aviso);background:var(--aviso-soft)}
.assign .big{font-family:var(--f-display);font-weight:760;font-size:1.6rem;letter-spacing:-.02em}

/* ---------- Insights ---------- */
.insight{display:grid;grid-template-columns:6px 1fr;gap:.85rem;padding:.85rem 1rem;border-top:1px solid var(--line)}
.insight:first-child{border-top:0}
.insight::before{content:"";border-radius:3px;background:var(--billete)}
.insight.alerta::before{background:var(--sello)} .insight.aviso::before{background:var(--aviso)} .insight.idea::before{background:var(--billete)}
.insight h4{font-family:var(--f-body);font-weight:700;font-size:.97rem}
.insight p{font-size:.9rem;color:var(--ink-2);margin-top:.15rem}
.insight .act{margin-top:.45rem}

/* ---------- Score ---------- */
.score{display:flex;gap:1rem;align-items:center}
.score svg{width:104px;height:104px;flex:none}
.score-parts{display:grid;gap:.55rem;margin-top:.9rem}
.score-parts .sp{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;font-size:.88rem}
.score-parts .sp .bar{grid-column:1/-1}

/* ---------- Legend ---------- */
.legend{display:grid;gap:.45rem;font-size:.9rem}
.legend>div{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.55rem}
.donut-wrap{display:grid;gap:1rem;align-items:center}
@media (min-width:560px){.donut-wrap{grid-template-columns:180px 1fr}}
.donut{width:180px;height:180px;margin:0 auto;display:block}
.donut text{fill:var(--ink)}
.chart{width:100%;height:auto;display:block;max-width:1000px}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .gridl{stroke:var(--line);stroke-width:1}

/* ---------- Optimizer ---------- */
.optim{border:2px solid var(--billete);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.optim-h{padding:1rem 1.1rem;background:var(--billete-soft);color:var(--billete-ink)}
.optim-h h2{color:var(--billete-ink)}
.optim-b{padding:1rem 1.1rem}
.phase{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.phase-steps{display:flex;gap:4px;margin:.6rem 0 .2rem}
.phase-steps i{height:6px;flex:1;border-radius:3px;background:var(--surface-3)}
.phase-steps i.on{background:var(--billete)}
.alloc{width:100%;border-collapse:collapse;font-size:.9rem}
.alloc th{text-align:left;font-weight:700;color:var(--ink-2);font-size:.8rem;padding:.4rem .3rem;border-bottom:1px solid var(--line)}
.alloc td{padding:.5rem .3rem;border-bottom:1px solid var(--line);vertical-align:top}
.alloc td.r,.alloc th.r{text-align:right;white-space:nowrap}
.alloc tr.grp td{font-weight:700;background:var(--surface-2)}
.reason{font-size:.82rem;color:var(--ink-2);margin-top:.15rem}
.alloc tr.has-why td{border-bottom:0;padding-bottom:.15rem}
.alloc tr.why td{padding-top:0}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- Locked / Plans ---------- */
.locked{border:1px dashed var(--oro);border-radius:var(--r-l);padding:1.4rem;background:var(--oro-soft)}
.locked h2{color:var(--oro)}
.plans{display:grid;gap:1rem}
@media (min-width:860px){.plans{grid-template-columns:repeat(3,1fr)}.plans.two{grid-template-columns:repeat(2,1fr)}}
.plan{border:1px solid var(--line);border-radius:var(--r-l);padding:1.2rem;background:var(--surface);display:flex;flex-direction:column;gap:.8rem}
.plan.hl{border:2px solid var(--billete)}
.plan .price{font-family:var(--f-display);font-weight:760;font-size:2.2rem;letter-spacing:-.03em}
.plan ul{margin:0;padding-left:1.1rem;font-size:.92rem;color:var(--ink-2)}
.plan ul li+li{margin-top:.3rem}
.plan .btn{margin-top:auto}
.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
.cmp th,.cmp td{padding:.55rem .5rem;border-bottom:1px solid var(--line);text-align:left}
.cmp td.c,.cmp th.c{text-align:center}

/* ---------- Tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media (min-width:720px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:.35rem;padding:1rem;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-decoration:none;color:var(--ink);min-height:112px}
.tile svg{width:24px;height:24px;color:var(--billete)}
.tile b{font-family:var(--f-display);font-size:1rem}
.tile span{font-size:.8rem;color:var(--ink-3)}

/* ---------- Goals ---------- */
.goal{padding:1rem 1.1rem;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .g-top{display:flex;gap:.75rem;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.goal .g-amt{font-family:var(--f-display);font-weight:700}
.goal .g-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--ink-3);margin:.45rem 0 .55rem}
.ef{display:grid;gap:1rem}
@media (min-width:720px){.ef{grid-template-columns:auto 1fr;align-items:center}}
.ef .months{font-family:var(--f-display);font-weight:760;font-size:3rem;letter-spacing:-.04em;line-height:1;color:var(--oro)}
.meter{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:4px;margin-top:.5rem}
.meter i{height:14px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden}
.meter i b{position:absolute;inset:0;background:var(--oro);width:var(--w,0%)}

/* ---------- Modal ---------- */
#modal-root[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,20,18,.5);z-index:60;animation:fade .15s ease-out}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:calc(100% - 2rem - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;padding:1.1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-sheet);animation:up .2s ease-out}
@media (min-width:720px){.sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(560px,calc(100% - 2rem));border-radius:var(--r-l);max-height:calc(100% - 3rem);animation:fade .15s ease-out}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.sheet-f{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.2rem}
.sheet-f .btn.danger{margin-right:auto}
form[data-type] [data-for]{display:none}
form[data-type="gasto"] [data-for~="gasto"],form[data-type="ingreso"] [data-for~="ingreso"],form[data-type="ahorro"] [data-for~="ahorro"]{display:block}
form[data-type="medeben"] [data-for~="medeben"],form[data-type="debo"] [data-for~="debo"]{display:block}
form [data-when]{display:none}
form [data-when].on{display:block}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Toast ---------- */
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(9rem + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:.5rem;width:min(460px,calc(100% - 2rem))}
@media (min-width:900px){#toast-root{bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--paper);border-radius:var(--r-m);padding:.7rem .9rem;display:flex;gap:.8rem;align-items:center;font-size:.92rem;animation:up .2s ease-out}
.toast button{margin-left:auto;background:none;border:0;color:var(--billete-soft);font-weight:700;cursor:pointer;text-decoration:underline}

/* ---------- Onboarding ---------- */
.ob{max-width:620px;margin:0 auto;padding:1.5rem 1rem 3rem}
.ob-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.ob-steps{display:flex;gap:5px;margin-bottom:1.4rem}
.ob-steps i{flex:1;height:5px;border-radius:3px;background:var(--surface-3)}
.ob-steps i.on{background:var(--billete)}
.ob h1{font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:-.03em}
.ob .lead{font-size:1.05rem;color:var(--ink-2);margin:.6rem 0 1.4rem;max-width:52ch}
.ob-actions{display:flex;gap:.6rem;justify-content:space-between;margin-top:1.6rem;flex-wrap:wrap}
.inc-row{display:grid;gap:.6rem;padding:.9rem;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
@media (min-width:560px){.inc-row{grid-template-columns:1.3fr 1fr 1fr auto;align-items:end}}

/* ---------- Coach ---------- */
.chat{display:grid;gap:.7rem}
.msg{padding:.75rem .9rem;border-radius:var(--r-m);max-width:92%;white-space:pre-wrap;font-size:.95rem}
.msg.me{background:var(--billete);color:var(--on-billete);justify-self:end}
.msg.ai{background:var(--surface);border:1px solid var(--line);justify-self:start}

.empty{padding:1.6rem 1.1rem;text-align:left}
.empty h3{margin-bottom:.3rem}
.empty p{color:var(--ink-2);max-width:52ch;margin-bottom:.9rem}
.notice{padding:.7rem .9rem;border-radius:var(--r-m);background:var(--aviso-soft);color:var(--ink);font-size:.9rem;border:1px solid color-mix(in srgb,var(--aviso) 35%,transparent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:.35rem 1rem;font-size:.92rem}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-weight:700}
.monthnav{display:flex;align-items:center;gap:.4rem}
.monthnav b{font-family:var(--f-display);min-width:9.5rem;text-align:center;text-transform:capitalize}
details.explain{border-top:1px solid var(--line);padding-top:.8rem;margin-top:1rem}
details.explain summary{cursor:pointer;font-weight:700;color:var(--billete)}
details.explain ol{padding-left:1.2rem;color:var(--ink-2);font-size:.9rem}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.list li .acts{display:flex;gap:.4rem;align-items:center;flex:none}
@media (max-width:560px){
  .list li.wrap-sm{flex-wrap:wrap}
  .list li.wrap-sm .grow{flex:1 1 55%}
  .list li.wrap-sm .acts{flex-basis:100%;justify-content:flex-end}
  .list li.wrap-sm .t,.list li.wrap-sm .s{white-space:normal}
}

/* sincronización */
.sync-dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.45rem;vertical-align:.05em;background:var(--ink-3)}
.sync-dot.ok{background:var(--ok)} .sync-dot.error{background:var(--sello)} .sync-dot.connecting,.sync-dot.offline,.sync-dot.choose{background:var(--aviso)}
.sync-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.3rem;font-weight:700;letter-spacing:.05em;text-align:center;padding:.8rem;margin:0;background:var(--surface-2);border-radius:var(--r-m);user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}

/* =====================================================================
   PAPEL MONEDA — escala tipográfica, superficies y detalles de identidad
   Escala (rem): .75 pie · .875 meta · 1 cuerpo · 1.125 título de fila y h3 · 1.375 h2 y cifras · 1.75 h1 (2.125 escritorio)
   ===================================================================== */
h1,h2,h3,h4{font-weight:600;line-height:1.1;letter-spacing:-.02em}
h1{font-size:1.75rem} h2{font-size:1.375rem} h3{font-size:1.125rem} h4{font-size:1rem}
@media (min-width:900px){h1{font-size:2.125rem}}
.small{font-size:.875rem} .tiny{font-size:.75rem}
.hint,.list .s,.bcat .meta,.goal .g-meta,.reason,.score-parts .sp,.bgroup-h .gsum,.side-foot,.bill-foot{font-size:.875rem}
.stats .s,.badge,.pro-tag,.bottomnav a,.plan-pill{font-size:.75rem}
.list .t{font-size:1.0625rem;line-height:1.3}
.insight h3{font-family:var(--f-body);font-weight:700;font-size:1rem;letter-spacing:0;line-height:1.35}
/* rótulos pequeños en versalitas */
.stats .k,.alloc th,.cmp th,.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
/* cifras: siempre en la tipografía de billete, alineadas */
.num,.inline-amt,.kv dd,.alloc td.r,.cmp td.c,.legend .num,.bill-foot b,.input[inputmode="decimal"]{font-family:var(--f-display);font-variant-numeric:tabular-nums lining-nums;font-weight:600;letter-spacing:-.01em}
.stats .v{font-size:1.375rem;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.list .amt,.goal .g-amt{font-weight:750;letter-spacing:-.02em}
.assign .big,.plan .price,.ef .months{font-weight:750}
/* número de serie: encabezados de fecha y clave de licencia */
.serial{font-family:var(--f-display);font-weight:600;font-size:.75rem;letter-spacing:.14em;font-variant-numeric:tabular-nums;text-transform:uppercase}
.day-h{font-family:var(--f-display);font-weight:600;font-size:.75rem;letter-spacing:.14em;font-variant-numeric:tabular-nums;text-transform:uppercase;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink-2);padding:.5rem 1rem;align-items:baseline}
.day-h .num{letter-spacing:0;font-size:.875rem;text-transform:none}
.panel.flush>.day-h:first-child,#tx-results .panel.flush>.day-h:first-of-type{border-top:0}

/* superficies y elevación */
.panel,.stats,.tile,.assign,.plan,.inc-row{box-shadow:var(--e1)}
:root:not([data-theme="dark"]) .panel,:root:not([data-theme="dark"]) .stats,:root:not([data-theme="dark"]) .tile{border-color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel,:root:not([data-theme="light"]) .stats,:root:not([data-theme="light"]) .tile{border-color:var(--line)}}
.bill{box-shadow:var(--e2)}
.bill::after{content:"";position:absolute;inset:6px;border:1px solid var(--bill-line);border-radius:16px;pointer-events:none}
.bill-art{opacity:.7}
.bill-amount{font-size:clamp(2.75rem,12vw,4rem);font-variant-numeric:lining-nums;font-weight:750;letter-spacing:-.03em;line-height:1.05}
.bill-top{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:1}
.bill-top .serial{color:var(--bill-foil)}
.bill-note{opacity:.94}
.bill-foot{opacity:.92}
.bill-seal{width:78px;height:78px}
@media (max-width:420px){.bill-seal{width:74px;height:74px}}
.fab{box-shadow:var(--e2)}
.sheet{box-shadow:var(--shadow-sheet)}
/* sello: solo para estados (excedido, meta cumplida, Pro) */
.stamp{display:inline-block;border:1.5px solid currentColor;border-radius:var(--r-xs);padding:.1rem .45rem;font-family:var(--f-display);font-weight:700;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-8deg);white-space:nowrap;line-height:1.4}
.stamp.over{color:var(--sello)} .stamp.gold{color:var(--oro)}
.bill .stamp{color:var(--bill-ink);border-color:var(--bill-ink)}
/* guilloche tenue: balance de pareja, panel Pro y cabecera de bienvenida */
.gui{position:relative;isolation:isolate;overflow:hidden}
.gui>.bill-art{stroke:var(--oro-foil);opacity:.16}
.locked.gui>.bill-art{opacity:.22}

/* barras: el exceso se distingue también por la trama, no solo por el color */
.bar.over>i{background:repeating-linear-gradient(135deg,var(--sello) 0 6px,color-mix(in srgb,var(--sello) 70%,#fff) 6px 9px)}
.dot.hatch{background:repeating-linear-gradient(135deg,var(--hc,var(--sello)) 0 3px,var(--surface) 3px 5px);border-radius:2px}

/* presupuesto: el nombre nunca pisa el monto */
.bcat{grid-template-columns:minmax(0,1fr) auto}
.bcat .nm{overflow:hidden}
.bcat .nm>button{min-width:0;flex:0 1 auto;overflow:hidden}
.inline-amt{min-height:44px;width:104px}

/* hojas: el botón de guardar siempre a la vista */
.sheet:has(.sheet-f){padding-bottom:0}
.sheet-f{position:sticky;bottom:0;z-index:2;background:var(--surface);margin:1.2rem -1.1rem 0;padding:.7rem 1.1rem calc(.7rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet .chips,.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-1.1rem;padding-inline:1.1rem;scroll-padding-inline:1.1rem}
.chips.scroll{margin-inline:-1rem;padding-inline:1rem}
.sheet .chips::-webkit-scrollbar,.chips.scroll::-webkit-scrollbar{display:none}
.sheet .chip,.chips.scroll .chip{flex:none}
.fields{grid-template-columns:minmax(0,1fr)}
.fields>*,.stack-s>*{min-width:0}
@media (min-width:560px){.fields.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.filterbar .chips.scroll{margin-inline:0;padding-inline:0}
.filterbar .iconbtn{background:var(--surface)}
.field-err{display:block;color:var(--sello);font-size:.875rem;font-weight:700;margin-top:.35rem}
.input[aria-invalid="true"]{border-color:var(--sello)}
details.more-f{border-top:1px solid var(--line);padding-top:.2rem}
details.more-f>summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:.4rem;color:var(--billete);font-weight:700}
details.more-f>summary::-webkit-details-marker{display:none}
details.more-f>summary::after{content:"";width:.5rem;height:.5rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:.2rem;margin-top:-.2rem}
details.more-f[open]>summary::after{transform:rotate(-135deg);margin-top:.2rem}
details.more-f[open]>summary{margin-bottom:.4rem}

/* teléfono: una sola cabecera por pantalla y el + anclado en la barra */
.topbar .more-link{display:none}
@media (max-width:899px){
  .topbar .view-title{display:none}
  .page-h p{display:none}
  .page-h{margin-bottom:.9rem}
  .topbar .more-link{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 .2rem 0 .6rem;color:var(--ink-2);text-decoration:none;font-size:.875rem;font-weight:700}
  .topbar .more-link svg{width:22px;height:22px}
  .topbar .more-link[aria-current="page"]{color:var(--billete)}
  .bottomnav{grid-template-columns:1fr 1fr 72px 1fr 1fr;min-height:58px}
  .fab{right:auto;left:50%;margin-left:-28px;width:56px;height:56px;bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 4px var(--surface),0 6px 14px rgba(11,94,78,.3)}
  .main{padding-bottom:6.5rem}
}
.bottomnav a{min-width:0}
.bottomnav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* avisos emergentes: píldora sobre la barra */
#toast-root{bottom:calc(5.6rem + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){#toast-root{bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))}}
.toast{border-radius:22px;width:fit-content;max-width:100%;margin-inline:auto;padding:.7rem 1.1rem;box-shadow:var(--e2)}
@keyframes flash{from{background:var(--billete-soft)}to{background:transparent}}
.list>li.flash{animation:flash 1.6s ease-out}

/* objetivos táctiles y textos mínimos */
.iconbtn{width:44px;height:44px}
.plan-pill{min-height:36px;padding:.4rem .8rem}
.panel-h a.small{padding:.7rem 0 .7rem .7rem;margin:-.7rem 0}
.panel-h a,.badge,.pro-tag{white-space:nowrap}
.chart text{font-size:12px}
.btn{border-radius:var(--r-s)}
.btn:disabled{opacity:1;background:var(--surface-2);color:var(--ink-3);border-color:transparent;filter:none}
.chip{min-height:36px}
.badge,.pro-tag{border-radius:var(--r-xs)}
.seg label,.seg .lang-btn{border-radius:7px}

/* tira de cifras: se parte en filas cuando el texto crece (zoom al 200 %) */
.stats{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.lang-seg{flex-wrap:wrap}
.statline{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;align-items:baseline;padding:0 .15rem}
.statline>div{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.statline .k{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.statline .v{font-family:var(--f-display);font-weight:750;font-size:1.125rem;letter-spacing:-.02em}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.mini{display:flex;flex-direction:column;gap:.2rem;padding:.75rem .8rem;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--e1);border:1px solid transparent;color:var(--ink);text-decoration:none;text-align:left;font:inherit;cursor:pointer;min-height:92px;min-width:0}
.mini .k{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);overflow-wrap:anywhere}
.mini .v{font-family:var(--f-display);font-weight:750;font-size:1.375rem;letter-spacing:-.02em;line-height:1.1}
.mini .s{font-size:.75rem;color:var(--ink-3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mini{border-color:var(--line)}}
:root[data-theme="dark"] .mini{border-color:var(--line)}
:root[data-theme="dark"] .panel,:root[data-theme="dark"] .stats,:root[data-theme="dark"] .tile{border-color:var(--line)}
.filterbar{display:flex;align-items:center;gap:.5rem}
.filterbar .chips{flex:1;min-width:0}
.filterbar .iconbtn[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filterbar .iconbtn{position:relative;flex:none}
.filterbar .iconbtn .on{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--aviso)}

/* planes y bienvenida */
.locked{border:1px solid var(--oro-foil);border-radius:var(--r-l)}
@media (max-width:859px){.plans .plan.hl{order:-1}}
.ob-actions .btn:not(.ghost){flex:1}
.ob-top .lang-seg{flex:none;padding:2px}
.ob-top .lang-seg .lang-btn{min-height:36px;padding:.2rem .6rem;font-size:.875rem}
.ob-link{display:inline-block;margin-top:1rem;padding:.6rem 0}

/* escritorio: columna de lectura cómoda */
@media (min-width:900px){
  .main{max-width:1040px}
  .topbar-in{max-width:1040px}
  .panel.flush>.list,.table-scroll>.cmp,.table-scroll>.alloc{max-width:none}
}

["Cómo cuenta Norte un san","How Norte accounts for a savings circle","Comment Norte comptabilise une tontine"],
["Antes de recibir, cada aporte se registra como <b>ahorro</b>: es dinero tuyo que el grupo te debe. Cuando recibes, no se anota como ingreso: recuperas lo aportado y el resto es un adelanto. Desde ahí, cada aporte se registra como <b>pago de deuda</b>. Así tu patrimonio y tu puntuación de salud no se inflan.","Before your payout, each contribution is recorded as <b>savings</b>: it’s your money, and the group owes it to you. When you get your payout, it isn’t recorded as income: you get back what you paid in and the rest is an advance. From then on, each contribution is recorded as a <b>debt payment</b>. That way your net worth and health score aren’t inflated.","Avant de recevoir votre part, chaque cotisation est enregistrée comme <b>épargne</b> : c’est votre argent, que le groupe vous doit. Quand vous recevez, ce n’est pas un revenu : vous récupérez vos cotisations et le reste est une avance. Ensuite, chaque cotisation est enregistrée comme un <b>remboursement de dette</b>. Ainsi, votre patrimoine et votre score de santé ne sont pas gonflés."],
["Un san funciona por la confianza entre sus miembros. No paga intereses y no lo respalda ningún banco ni seguro: participa solo con gente que conoces bien.","A savings circle runs on trust between its members. It pays no interest and no bank or insurer backs it: only join with people you know well.","Une tontine repose sur la confiance entre ses membres. Elle ne rapporte pas d’intérêts et n’est garantie par aucune banque ni assurance : n’y participez qu’avec des personnes que vous connaissez bien."],
["Me deben","Owed to me","On me doit"],
["Debo","I owe","Je dois"],
["Prestar o pedir prestado no es gasto ni ingreso: solo cambia lo que tienes y lo que debes. Por eso estos préstamos no crean movimientos y entran directo a tu patrimonio. Lo que marques como dudoso no se suma.","Lending or borrowing is neither an expense nor income: it only changes what you own and what you owe. That’s why these loans don’t create transactions and go straight into your net worth. Anything you mark as doubtful isn’t counted.","Prêter ou emprunter n’est ni une dépense ni un revenu : cela change seulement ce que vous possédez et ce que vous devez. C’est pourquoi ces prêts ne créent pas de transactions et entrent directement dans votre patrimoine. Ce que vous marquez comme douteux n’est pas compté."],
