    <div class="filterbar"><div class="chips scroll" role="group" aria-label="Filtrar por tipo">${types.map(([v, l]) => _t`<button class="chip" data-act="filter-type" data-v="${v}" aria-pressed="${f.type === v}">${esc(l)}</button>`).join('')}</div>
      <button type="button" class="iconbtn" data-act="filter-toggle" aria-expanded="${fOpen}" aria-controls="tx-filters" aria-label="Buscar y filtrar">${icon('filter')}${(f.q || f.cat) && !fOpen ? '<span class="on"></span>' : ''}</button></div>
    ${fOpen ? _t`<div class="fields two" id="tx-filters"><label class="field"><span>Buscar</span><input id="tx-search" class="input" type="search" data-bind="search" value="${esc(f.q)}" placeholder="Nota o categoría" autocomplete="off" maxlength="60"></label>
      <label class="field"><span>Categoría</span><select class="input" data-bind="filter-cat"><option value="">Todas</option>${catOpts}</select></label></div>` : ''}
    <div id="tx-results" class="stack">${txResultsHtml(ctx)}</div>
    <div class="row wrap"><button class="btn ghost small" data-act="export-csv">Exportar CSV${isPro() ? '' : ' (Pro)'}</button>${importEntry()}</div>
  </div>`;
}

/* ---------- Presupuesto ---------- */
function vPresupuesto(ctx) {
  const mk = UI.month;
  const tot = monthTotals(ctx, mk);
  const cls = Math.abs(tot.unassigned) < 1 ? 'zero' : tot.unassigned < 0 ? 'over' : 'left';
  const assignMsg = Math.abs(tot.unassigned) < 1 ? 'Cada peso tiene un trabajo. Presupuesto base cero.' : tot.unassigned < 0 ? _t`Asignaste ${fmt(-tot.unassigned)} más de lo que ganas. Reduce alguna categoría.` : _t`Te faltan ${fmt(tot.unassigned)} por asignar. El dinero sin plan se escapa.`;
  const incomes = ctx.inc.items;
  // distribución por grupo (antes vivía en Inicio)
  const msD = monthSummary(ctx, mk);
  const dist = GROUPS.map(g => ({ g, budget: sum(activeCats(S).filter(c => c.group === g.id), c => budgetFor(S, c.id, mk)), spent: msD.byGroup[g.id] || 0 })).filter(x => x.budget > 0 || x.spent > 0);
  const dp = donutPlan(dist, x => x.budget);
  const groupsHtml = GROUPS.map(g => {
    const cats = activeCats(S).filter(c => c.group === g.id);
    if (!cats.length) return '';
    const open = UI.openGroups[g.id] !== false;
    const rows = cats.map(c => {
      const s = catStatus(ctx, c, mk);
      const isSave = g.kind === 'ahorro';
      const base = s.budget + s.carry;
      const metaL = isSave ? _t`Aportado ${fmt(s.spent)}` : _t`Gastado ${fmt(s.spent)}`;
      const metaR = isSave ? (s.budget > 0 ? _t`${pct(Math.min(1, s.spent / Math.max(1, s.budget)))} del plan` : '') : (s.avail >= 0 ? _t`Quedan ${fmt(s.avail)}` : _t`Excedido ${fmt(-s.avail)}`);
      return _t`<div class="bcat"><div class="nm"><button class="linkbtn" style="text-decoration:none;color:var(--ink)" data-act="cat-edit" data-id="${c.id}"><span>${esc(nm(c))}</span></button>${c.fixed ? _t`<span class="badge">fijo</span>` : ''}${c.rollover ? _t`<span class="badge green" title="Lo que no gastes pasa al mes siguiente">acumula</span>` : ''}</div>
        <input maxlength="24" class="inline-amt" id="b-${c.id}" inputmode="decimal" data-bind="budget" data-id="${c.id}" value="${s.budget ? esc(fmtN(s.budget, Math.abs(s.budget % 1) > 0.004 ? 2 : 0)) : ''}" placeholder="0" aria-label="Presupuesto de ${esc(nm(c))}">
        ${barHtml(base > 0 ? s.spent / base : (s.spent > 0 ? 1 : 0), isSave ? 'gold' : s.state === 'over' ? 'over' : s.state === 'warn' ? 'warn' : '', 'thin')}
        <div class="meta"><span>${esc(metaL)}${s.carry > 0 ? _t`, +${esc(fmt(s.carry))} acumulado` : ''}</span><span class="${!isSave && s.avail < 0 ? 'neg' : ''}">${esc(metaR)}</span></div></div>`;
    }).join('');
    const gb = sum(cats, c => budgetFor(S, c.id, mk)), gs = sum(cats, c => monthSummary(ctx, mk).byCat[c.id] || 0);
    return _t`<div class="bgroup"><button class="bgroup-h" data-act="group-toggle" data-id="${g.id}" aria-expanded="${open}"><span class="dot" style="background:${g.color}"></span><h3>${esc(nm(g))}</h3><span class="gsum"><span class="num">${esc(fmt(gs))} / ${esc(fmt(gb))}</span><br><span class="tiny faint">${tot.I > 0 ? _t`${pct(gb / tot.I)} del ingreso` : ''}</span></span></button>${open ? rows : ''}</div>`;
  }).join('');

  return _t`<div class="stack-l">
    <div class="page-h"><div><h1>Presupuesto</h1><p>Escribe cuánto le toca a cada categoría o deja que el optimizador lo calcule por ti.</p></div>${monthNav(mk)}</div>
    <div class="row wrap"><button class="btn" data-act="optim-open">Optimizar mi presupuesto</button><button class="btn ghost" data-act="cat-new">Nueva categoría</button></div>
    ${UI.optimOpen ? optimizerHtml(ctx) : ''}
    <section class="panel flush" aria-labelledby="h-inc"><div class="panel-h" style="padding:1rem 1rem 0"><h2 id="h-inc">Ingresos</h2><button class="btn small ghost" data-act="income-new">Agregar ingreso</button></div>
      ${incomes.length ? _t`<ul class="list">${incomes.map(i => _t`<li><button class="rowbtn" data-act="income-edit" data-id="${i.id}"><span class="dot" style="background:var(--billete)"></span><div class="grow"><div class="t">${esc(nm(i))}</div><div class="s">${esc(FREQS[i.freq] ? FREQS[i.freq].label : '')}${i.variable ? _t`, variable: presupuesto con ${i.conservativeAuto ? 'el 70% del promedio' : 'el mínimo'}` : ''}${i.currency && i.currency !== S.profile.currency ? _t`, ${esc(fmt(i.amount, i.currency))}` : ''}</div></div><span class="amt">${M(i.monthly)}<span class="tiny faint"> /mes</span></span></button></li>`).join('')}</ul>`
        : emptyBox('Agrega tu primer ingreso', 'Salario, negocio, comisiones, remesas, trading… Si varía, marca “variable” y usamos una cifra conservadora.', _t`<button class="btn small" data-act="income-new">Agregar ingreso</button>`)}
      ${incomes.length ? _t`<div class="row between" style="padding:.8rem 1rem;border-top:1px solid var(--line)"><b>Ingreso mensual para presupuestar</b><b>${M(tot.I)}</b></div>` : ''}
    </section>
    <div class="assign ${cls}" role="status"><div><div class="small muted">Por asignar</div><div class="big num">${esc(fmt(tot.unassigned))}</div></div><p class="grow small">${esc(assignMsg)}</p></div>
    <section class="panel flush" aria-label="Categorías">${groupsHtml || emptyBox('Sin categorías', 'Crea tu primera categoría.', _t`<button class="btn" data-act="cat-new">Nueva categoría</button>`)}</section>
    ${dist.length ? _t`<section class="panel" aria-labelledby="h-dist"><div class="panel-h"><h2 id="h-dist">Tu plan este mes</h2></div>
      <div class="donut-wrap">${svgDonut(dp.segs, { center: fmtC(tot.assigned), sub: 'asignado', label: 'Distribución del presupuesto por grupo' })}
      <div class="legend">${dist.map(x => _t`<div><span class="dot" style="background:${dp.col(x)}"></span><span>${esc(nm(x.g))}<span class="tiny faint"> ${tot.I > 0 ? pct(x.budget / tot.I) : ''}</span>${barHtml(x.budget > 0 ? x.spent / x.budget : 0, x.g.kind === 'ahorro' ? 'gold' : x.spent > x.budget ? 'over' : x.spent > x.budget * 0.8 ? 'warn' : '', 'thin')}</span><span class="num small">${esc(fmt(x.spent))} / ${esc(fmt(x.budget))}</span></div>`).join('')}</div></div></section>` : ''}
    ${archivedCatsHtml()}
  </div>`;
}
function archivedCatsHtml() {
  const arch = S.categories.filter(c => c.archived);
  if (!arch.length) return '';
  return _t`<details class="panel"><summary class="small" style="cursor:pointer;font-weight:700">Categorías archivadas (${arch.length})</summary><ul class="list" style="margin-top:.6rem">${arch.map(c => _t`<li><div class="grow">${esc(nm(c))}</div><button class="btn small ghost" data-act="cat-unarchive" data-id="${c.id}">Restaurar</button></li>`).join('')}</ul></details>`;
}

function optimizerHtml(ctx) {
  const method = UI.optimMethod || S.settings.method || 'optimizador';
  const o = optimize(ctx, method, { pct: UI.payPct, money: fmt, mk: UI.month });
  if (o.error) return _t`<section class="optim"><div class="optim-b"><p>${esc(o.error)}</p><button class="btn small" data-act="income-new">Agregar ingreso</button></div></section>`;
  const I = o.I, B = o.buckets;
  const methods = Object.entries(METHODS).map(([k, l]) => _t`<button class="chip" data-act="optim-method" data-v="${k}" aria-pressed="${method === k}">${esc(l)}</button>`).join('');
  const bucketSegs = [
    { k: 'needs', label: 'Necesidades y deudas mínimas', color: 'var(--c2)' },
    { k: 'life', label: 'Estilo de vida', color: 'var(--c5)' },
    { k: 'ef', label: 'Fondo de emergencia', color: 'var(--c3)' },
    { k: 'debt', label: 'Abono extra a deudas', color: 'var(--c4)' },
    { k: 'goals', label: 'Metas', color: 'var(--c1)' },
    { k: 'inv', label: 'Inversión', color: 'var(--c6)' },
  ].map(s => ({ ...s, value: B[s.k] || 0 })).filter(s => s.value > 0);
  const rows = GROUPS.map(g => {
    const cats = activeCats(S).filter(c => c.group === g.id);
    if (!cats.length) return '';
    const cur = sum(cats, c => budgetFor(S, c.id, UI.month)), prop = sum(cats, c => o.alloc[c.id] || 0);
    const head = _t`<tr class="grp"><td><span class="dot" style="background:${g.color}"></span> ${esc(nm(g))}</td><td class="r num">${esc(fmt(cur))}</td><td class="r num">${esc(fmt(prop))}</td></tr>`;
    return head + cats.map(c => {
      const a = budgetFor(S, c.id, UI.month), p = o.alloc[c.id] || 0;
      const reason = o.reasons[c.id] || '';
      return _t`<tr${reason ? ' class="has-why"' : ''}><td>${esc(nm(c))}</td><td class="r num faint">${esc(fmt(a))}</td><td class="r num ${p > a + 0.5 ? 'pos' : p < a - 0.5 ? 'neg' : ''}"><b>${esc(fmt(p))}</b></td></tr>${reason ? _t`<tr class="why"><td colspan="3"><div class="reason">${esc(reason)}</div></td></tr>` : ''}`;
    }).join('');
  }).join('');
  const ph = o.deficit ? null : o.phaseInfo;
  return _t`<section class="optim" aria-labelledby="h-optim">
    <div class="optim-h"><h2 id="h-optim">${o.deficit ? 'Plan de rescate' : 'Tu plan optimizado'}</h2>
      ${ph ? _t`<div class="phase-steps" aria-hidden="true">${[1, 2, 3, 4].map(n => _t`<i class="${n <= ph.n ? 'on' : ''}"></i>`).join('')}</div><p><b>Fase ${ph.n} de 4: ${esc(ph.name)}.</b> ${esc(ph.text)}</p>` : _t`<p>${esc(o.warnings[0] || '')}</p>`}
    </div>
    <div class="optim-b stack">
      <div class="chips" role="group" aria-label="Método">${methods}</div>
      ${method === 'pagate-primero' ? _t`<label class="field"><span>Porcentaje que te pagas primero: ${UI.payPct}%</span><input type="range" min="5" max="50" step="1" value="${UI.payPct}" data-bind="paypct" style="width:100%;accent-color:var(--billete)"></label>` : ''}
      ${(o.deficit ? o.warnings.slice(1) : o.warnings).map(w => _t`<p class="notice">${esc(w)}</p>`).join('')}
      <div class="donut-wrap">${svgDonut(bucketSegs.map(s => ({ ...s, title: fmt(s.value) })), { center: pct(o.savingsRate || 0), sub: 'ahorro total', label: 'Reparto propuesto' })}
        <div class="legend">${bucketSegs.map(s => _t`<div><span class="dot" style="background:${s.color}"></span><span>${esc(s.label)}</span><span class="num small">${esc(fmt(s.value))} <span class="faint">${pct(s.value / I)}</span></span></div>`).join('')}</div></div>
      ${o.deficit ? '' : _t`<p class="small muted">${esc(o.lifeReason)}</p>`}
      <div class="table-scroll"><table class="alloc"><thead><tr><th>Categoría</th><th class="r">Actual</th><th class="r">Propuesto</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="row wrap"><button class="btn" data-act="optim-apply" data-m="${method}">Aplicar a ${esc(monthLabel(UI.month))}</button><button class="btn ghost" data-act="optim-close">Cerrar</button></div>
      <p class="tiny faint">Tus gastos esenciales se respetan tal como los escribiste: el optimizador reparte lo que queda. Después de aplicar puedes ajustar cualquier categoría a mano.</p>
      <details class="explain"><summary>Cómo decide el optimizador</summary><ol>
        <li>Toma tu ingreso conservador (en ingresos variables usa el mínimo esperado) y resta necesidades y pagos mínimos.</li>
        <li>Detecta tu fase: sin colchón de un mes, con deuda cara (10% anual o más), completando el fondo de emergencia, o en crecimiento.</li>
        <li>Calcula tu meta de fondo de emergencia: 3 meses, más si tu ingreso es variable o tienes dependientes (hasta 9).</li>
        <li>Reparte la bolsa de seguridad entre colchón, deuda, metas e inversión según la fase, con topes: nunca aporta más de lo que falta.</li>
        <li>Garantiza dinero para disfrutar (familia, pareja, personal, diversión y hobbies), con un máximo del 30% del ingreso.</li>
        <li>Redondea y cuadra exacto: la suma es igual a tu ingreso. Base cero.</li></ol></details>
    </div></section>`;
}

function goalRowHtml(ctx, g, compact) {
  const gi = goalInfo(ctx, g);
  const deadline = g.deadline && isValidDate(g.deadline) ? shortDate(g.deadline) : null;
  return _t`<div class="goal"><div class="g-top"><b>${esc(nm(g))}</b><span class="g-amt num">${esc(fmt(gi.saved))} <span class="faint small">de ${esc(fmt(gi.target))}</span></span></div>
    <div class="g-meta">${deadline ? _t`<span>Fecha: ${esc(deadline)}</span>` : _t`<span>Sin fecha límite</span>`}${gi.rem > 0 && gi.monthly > 0 ? _t`<span>Necesitas ${esc(fmt(gi.monthly))}/mes</span>` : ''}${gi.rem > 0 && gi.eta != null ? _t`<span>A tu ritmo: ${gi.eta} ${tn(gi.eta, 'mes', 'meses')}</span>` : ''}${gi.rem <= 0 ? _t`<span class="stamp gold">Meta cumplida</span>` : gi.late && diffDays(g.createdAt || ctx.today, ctx.today) >= 30 ? _t`<span class="badge red">Atrasada</span>` : ''}</div>
    ${barHtml(gi.pct, 'gold')}
    ${compact ? '' : _t`<div class="row wrap" style="margin-top:.7rem"><button class="btn small soft" data-act="goal-contrib" data-id="${g.id}">Aportar</button><button class="btn small ghost" data-act="goal-withdraw" data-id="${g.id}">Retirar</button><button class="btn small ghost" data-act="goal-edit" data-id="${g.id}">Editar</button></div>`}</div>`;
}

/* =====================================================================
   VIEWS 2 — metas, deudas, inversión, pareja, fijos, deseos, patrimonio
   ===================================================================== */
'use strict';

/* ---------- Metas ---------- */
function vMetas(ctx) {
  const ef = efStatus(ctx);
  const efCat = activeCats(S).find(c => c.group === 'emergencia');
  const efMonthly = efCat ? budgetFor(S, efCat.id, ctx.mk) : 0;
  const n = Math.max(1, Math.ceil(ef.T));
  const cells = Array.from({ length: n }, (_, i) => _t`<i><b style="width:${(clamp(ef.coverage - i, 0, 1) * 100).toFixed(0)}%"></b></i>`).join('');
  const metas = S.goals.filter(g => g.kind === 'meta');
  const inv = S.goals.find(g => g.kind === 'inversion');
  const canAdd = isPro() || metas.length < CONFIG.FREE_GOALS;
  return _t`<div class="stack-l">
    <div class="page-h"><div><h1>Metas y ahorros</h1><p>Tu colchón primero, tus sueños después. Cada aporte que registres aquí suma a la meta.</p></div>
      <button class="btn" data-act="${canAdd ? 'goal-new' : 'paywall'}" data-f="goals">Nueva meta</button></div>
    ${ef.goal ? _t`<section class="panel stack" aria-labelledby="h-efm"><div class="panel-h"><h2 id="h-efm">Fondo de emergencia</h2><button class="btn small ghost" data-act="goal-edit" data-id="${ef.goal.id}">Ajustar</button></div>
      <div class="ef"><div><div class="months num">${lnum(ef.coverage.toFixed(1))}</div><div class="small muted">meses cubiertos de ${ef.T}</div></div>
        <div><div class="meter" style="--n:${n}">${cells}</div>
          <dl class="kv" style="margin-top:.9rem"><dt>Ahorrado</dt><dd>${M(ef.F)}</dd><dt>Meta</dt><dd>${M(ef.target)}</dd><dt>Un mes de gastos esenciales</dt><dd>${M(ef.M)}</dd><dt>Aporte planificado</dt><dd>${M(efMonthly)}/mes</dd>${ef.gap > 0 && efMonthly > 0 ? _t`<dt>Lo completas en</dt><dd>${Math.ceil(ef.gap / efMonthly)} meses</dd>` : ''}</dl></div></div>
      <p class="small muted">${ef.goal.manual ? 'Meta fijada a mano.' : _t`Meta automática: ${lnum(ef.T)} meses porque ${ctx.inc.variableShare > 0.2 ? 'parte de tu ingreso es variable' : 'tu ingreso es estable'}${(S.profile.dependents || 0) > 0 ? ' y tienes dependientes' : ''}.`} Guárdalo en una cuenta separada, líquida y que no veas a diario.</p>
      <div class="row wrap"><button class="btn small soft" data-act="goal-contrib" data-id="${ef.goal.id}">Aportar</button><button class="btn small ghost" data-act="goal-withdraw" data-id="${ef.goal.id}">Usar para una emergencia</button></div></section>` : ''}
    <section class="panel flush" aria-labelledby="h-gl"><div class="panel-h" style="padding:1rem 1rem 0"><h2 id="h-gl">Tus metas</h2>${isPro() ? '' : _t`<span class="tiny faint">${Math.min(metas.length, CONFIG.FREE_GOALS)} de ${CONFIG.FREE_GOALS} en plan Gratis</span>`}</div>
      ${metas.length ? metas.map(g => goalRowHtml(ctx, g, false)).join('') : emptyBox('Ponle nombre a tus sueños', 'Viaje, carro, inicial de una casa, estudios, boda… Con fecha, te decimos cuánto apartar cada mes.', _t`<button class="btn" data-act="goal-new">Crear meta</button>`)}</section>
    ${inv ? _t`<section class="panel" aria-labelledby="h-inv"><div class="panel-h"><h2 id="h-inv">Portafolio de inversión</h2><a class="small" href="#/inversion">Simular</a></div>
      <p style="font-family:var(--f-display);font-weight:760;font-size:1.8rem" class="num">${esc(fmt(ctx.goalSaved.get(inv.id) || 0))}</p><p class="small muted">Suma de tus aportes registrados en la categoría Inversión.</p>
      <div class="row wrap" style="margin-top:.7rem"><button class="btn small soft" data-act="goal-contrib" data-id="${inv.id}">Registrar aporte</button><button class="btn small ghost" data-act="goal-withdraw" data-id="${inv.id}">Registrar retiro</button><button class="btn small ghost" data-act="goal-edit" data-id="${inv.id}">Editar</button></div></section>` : ''}
  </div>`;
}

/* ---------- Deudas ---------- */
function vDeudas(ctx) {
  const debts = S.debts;
  const active = debts.filter(d => d.balance > 0);
  const totalBal = sum(active, d => d.balance), totalMin = sum(active, d => d.minPayment);
  const debtCat = activeCats(S).find(c => c.group === 'deudas');
  const planned = debtCat ? budgetFor(S, debtCat.id, ctx.mk) : 0;
  if (UI.debtExtra == null) UI.debtExtra = Math.max(0, Math.round(planned - totalMin));
  const list = debts.length ? _t`<ul class="list">${debts.map(d => _t`<li class="wrap-sm"><div class="grow"><div class="t">${esc(nm(d))}</div><div class="s">${esc(lnum(d.rate || 0))}% anual, mínimo ${esc(fmt(d.minPayment))}${(Number(d.rate) || 0) >= 10 && d.balance > 0 ? ', deuda cara' : ''}</div></div><span class="amt ${d.balance > 0 ? '' : 'pos'}">${d.balance > 0 ? M(d.balance) : 'Pagada'}</span><div class="acts"><button class="btn small soft" data-act="debt-pay" data-id="${d.id}" ${d.balance > 0 ? '' : 'disabled'}>Pagar</button><button class="iconbtn" data-act="debt-edit" data-id="${d.id}" aria-label="Editar ${esc(nm(d))}">${icon('edit')}</button></div></li>`).join('')}</ul>` : emptyBox('Sin deudas registradas', 'Tarjetas, préstamos, cooperativa, financiamientos… Regístralas para planificar cómo salir más rápido y con menos intereses.', _t`<button class="btn" data-act="debt-new">Agregar deuda</button>`);
  let sim = '';
  if (active.length) {

      const cut = s => s.slice(0, len);
      const ticks = []; const stp = len > 120 ? 24 : len > 48 ? 12 : 6; for (let i = 0; i < len; i += stp) ticks.push({ i, label: i === 0 ? 'Hoy' : _t`Mes ${i}` });
      const best = !av.never && !sn.never && av.interest <= sn.interest ? 'avalancha' : 'bola';
      sim = _t`<section class="panel stack" aria-labelledby="h-sim"><div class="panel-h"><h2 id="h-sim">Simulador de salida</h2></div>
        <label class="field"><span>Pago extra mensual además de los mínimos</span><input maxlength="24" class="input" inputmode="decimal" id="debt-extra" data-bind="debt-extra" value="${esc(String(extra))}"></label>

          <tr><td><b>Bola de nieve</b>${best === 'bola' ? _t` <span class="badge green">recomendada</span>` : ''}<div class="tiny faint">Saldo más pequeño primero</div></td><td class="c">${esc(fmtM(sn))}<div class="tiny faint">${esc(freeDate(sn))}</div></td><td class="c num">${esc(sn.never ? '—' : fmt(sn.interest))}</td></tr>

        ${svgLines([{ name: 'Solo mínimos', values: cut(mn.series), color: 'var(--line-strong)', dash: '5 4' }, { name: 'Bola de nieve', values: cut(sn.series), color: 'var(--c2)', dash: '9 3' }, { name: 'Avalancha', values: cut(av.series), color: 'var(--c1)' }], { xTicks: ticks, label: 'Saldo total de deudas por mes' })}

        <p class="tiny faint">Supuestos: tasas fijas, interés mensual compuesto (tasa anual ÷ 12) y cuota total constante; lo que libera una deuda pagada pasa a la siguiente.</p></section>`;

  return _t`<div class="stack-l">
    <div class="page-h"><div><h1>Deudas</h1><p>Primero la más cara. Cada peso extra a una deuda del 60% anual rinde 60% garantizado.</p></div><button class="btn" data-act="debt-new">Agregar deuda</button></div>

/* ---------- Inversión y libertad financiera ---------- */
let _mcCache = { key: '', res: null };
// porcentajes escritos con punto o con coma (7.5 o 7,5)
const pctIn = v => { const n = parseDecimal(v); return isFinite(n) ? clamp(n, -100, 1000) : 0; };
function vInversion(ctx) {
  if (!isPro()) return _t`<div class="stack-l"><div class="page-h"><div><h1>Inversión y libertad financiera</h1><p>Proyecta tu dinero con ${fmtN(2000)} escenarios de mercado, no con una sola línea optimista.</p></div></div>${lockedPanel('invest', 'Simulador Monte Carlo', 'Mira el rango realista de lo que puede valer tu inversión (escenario malo, típico y bueno), la probabilidad de llegar a tu meta y el año en que podrías vivir de tus inversiones.')}</div>`;
  const inv = S.goals.find(g => g.kind === 'inversion');
  const invCat = activeCats(S).find(c => c.group === 'inversion');
  const p = UI.mc;
  const initial = p.initial === '' ? (inv ? ctx.goalSaved.get(inv.id) || 0 : 0) : parseAmount(p.initial);
  const invBudget = invCat ? budgetFor(S, invCat.id, ctx.mk) : 0;
  const suggested = invBudget > 0 ? invBudget : Math.round(ctx.inc.total * 0.10 / 100) * 100;
  const monthly = p.monthly === '' ? suggested : parseAmount(p.monthly);
  const params = { initial, monthly, years: clamp(parseInt(p.years, 10) || 25, 1, 60), mu: pctIn(p.mu) / 100, sigma: Math.max(0, pctIn(p.sigma)) / 100, inflation: pctIn(p.inflation) / 100, growth: pctIn(p.growth) / 100, target: parseAmount(p.target), real: !!p.real, sims: 2000 };
  const key = JSON.stringify(params);
  if (_mcCache.key !== key) _mcCache = { key, res: monteCarlo(params) };
  const r = _mcCache.res, last = r.bands[r.years];
  const fire = fireInfo(ctx, params.mu, params.inflation);
  const f = (id, label, val, hint) => _t`<label class="field"><span>${esc(label)}</span><input maxlength="24" class="input" id="mc-${id}" inputmode="decimal" data-bind="mc" data-k="${id}" value="${esc(String(val))}">${hint ? _t`<span class="hint">${esc(hint)}</span>` : ''}</label>`;
  return _t`<div class="stack-l">
    <div class="page-h"><div><h1>Inversión y libertad financiera</h1><p>${fmtN(2000)} escenarios de mercado con rendimientos aleatorios. Así ves el rango real, no una promesa.</p></div></div>
    <section class="panel stack"><div class="fields two">
      ${f('initial', 'Capital inicial', p.initial === '' ? Math.round(initial) : p.initial, 'Por defecto: tu portafolio registrado')}
      ${f('monthly', 'Aporte mensual', p.monthly === '' ? Math.round(monthly) : p.monthly, invBudget > 0 ? 'Por defecto: tu presupuesto de inversión' : 'Sugerencia: 10% de tu ingreso (hoy tu plan no asigna inversión)')}
      ${f('years', 'Años', p.years)}
      ${f('mu', 'Rendimiento anual esperado (%)', p.mu, 'Índice global de acciones: 7–10% histórico')}
      ${f('sigma', 'Volatilidad anual (%)', p.sigma, 'Acciones ~15–20%, bonos ~5%, certificados ~0–1%')}
      ${f('inflation', 'Inflación anual (%)', p.inflation)}
      ${f('growth', 'Aumento anual de tu aporte (%)', p.growth)}
      ${f('target', 'Meta (opcional)', p.target)}
    </div><label class="check"><input type="checkbox" data-bind="mc-real" ${p.real ? 'checked' : ''}> Mostrar en dinero de hoy (descontando inflación)</label></section>
    <div class="stats"><div><div class="k">Escenario típico</div><div class="v">${M(last.p50)}</div><div class="s">mediana</div></div><div><div class="k">Escenario malo</div><div class="v">${M(last.p10)}</div><div class="s">9 de cada 10 terminan arriba</div></div><div><div class="k">Escenario bueno</div><div class="v">${M(last.p90)}</div><div class="s">1 de cada 10 termina arriba</div></div><div><div class="k">Total aportado</div><div class="v">${M(last.contrib)}</div><div class="s">${params.real ? 'en dinero de hoy' : 'nominal'}</div></div></div>
    <section class="panel stack"><div class="panel-h"><h2>Proyección a ${r.years} años</h2></div>${svgFan(r.bands, { target: params.target })}
      <p class="small muted">Franja clara: 80% de los escenarios. Franja oscura: 50%. Línea: mediana. Punteada: lo que aportas.</p>
      ${r.probTarget != null ? _t`<p><b>Probabilidad de llegar a ${esc(fmt(params.target))}:</b> ${pct(r.probTarget)}</p>` : ''}
      <p class="small">Probabilidad de terminar con menos de lo aportado: ${pct(r.probLoss)}. ${r.years < 5 ? 'En plazos cortos el riesgo pesa más: usa instrumentos de baja volatilidad.' : 'Con más años, la probabilidad de pérdida cae.'}</p></section>
    <section class="panel stack" aria-labelledby="h-fire"><div class="panel-h"><h2 id="h-fire">Libertad financiera</h2></div>
      ${fire.number > 0 ? _t`<p>Tus gastos presupuestados suman ${M(fire.annual)} al año. Con la regla del 4%, necesitas <b>${M(fire.number)}</b> invertidos para vivir de los rendimientos.</p>
      ${barHtml(fire.pct, 'gold')}<p class="small muted">Llevas ${M(fire.current)} (${pct(fire.pct, 1)}). ${fire.months != null ? _t`Aportando ${fmt(fire.invest)} al mes con rendimiento real de ${pct((1 + params.mu) / (1 + params.inflation) - 1, 1)}, llegarías en unos <b>${Math.floor(fire.months / 12)} años y ${fire.months % 12} meses</b>.` : 'Con tu aporte actual no se alcanza en 100 años: sube tu aporte a inversión.'}</p>` : _t`<p class="muted">Crea tu presupuesto para calcular tu número de libertad.</p>`}
      <p class="tiny faint">Modelo: rendimientos mensuales lognormales independientes, semilla fija para resultados reproducibles. Es educativo, no una recomendación de inversión.</p></section>
  </div>`;
}

/* ---------- Pagos fijos y suscripciones ---------- */

    ${isPro() ? (det.length ? _t`<section class="panel flush"><div class="panel-h" style="padding:1rem 1rem 0"><h2>Detectados en tus movimientos</h2></div><ul class="list">${det.map((d, i) => _t`<li><div class="grow"><div class="t">${esc(nm(d))}</div><div class="s">Aparece en ${d.months} meses</div></div><span class="amt">${M(d.amount)}</span><button class="btn small soft" data-act="sub-add" data-i="${i}">Agregar</button></li>`).join('')}</ul></section>` : '')

/* ---------- Lista de deseos ---------- */
function vDeseos(ctx) {
  const hr = hourlyRate(ctx);
  const items = S.wishlist.slice().sort((a, b) => (a.status === 'esperando' ? 0 : 1) - (b.status === 'esperando' ? 0 : 1) || String(b.addedAt).localeCompare(String(a.addedAt)));
  const waiting = items.filter(w => w.status === 'esperando');
  const saved = sum(items.filter(w => w.status === 'descartado'), w => w.price);
  const fun = activeCats(S).filter(c => ['diversion', 'hobbies', 'personal'].includes(c.group) && !c.fixed);
  const funLeft = sum(fun, c => Math.max(0, catStatus(ctx, c, ctx.mk).avail));
  return _t`<div class="stack-l">
    <div class="page-h"><div><h1>Lista de deseos</h1><p>Antes de comprar por impulso, déjalo enfriar. Mientras más caro frente a tu presupuesto de gustos, más días de espera.</p></div><button class="btn" data-act="wish-new">Agregar deseo</button></div>
    <div class="stats"><div><div class="k">En espera</div><div class="v">${waiting.length}</div></div><div><div class="k">Valor en espera</div><div class="v">${M(sum(waiting, w => w.price))}</div></div><div><div class="k">Te ahorraste</div><div class="v pos">${M(saved)}</div><div class="s">en deseos descartados</div></div><div><div class="k">Disponible para gustos</div><div class="v">${M(funLeft)}</div><div class="s">este mes</div></div></div>
    <section class="panel flush">${items.length ? _t`<ul class="list">${items.map(w => {
      const ready = addDays(w.addedAt, w.cooldownDays || 0);
      const left = diffDays(ctx.today, ready);
      const fits = w.price <= funLeft;
      const st = w.status === 'comprado' ? _t`<span class="badge">comprado</span>` : w.status === 'descartado' ? _t`<span class="badge green">descartado</span>` : left > 0 ? _t`<span class="badge amber">faltan ${left} ${tn(left, 'día', 'días')}</span>` : _t`<span class="badge green">listo para decidir</span>`;
      return _t`<li class="wrap-sm"><div class="grow"><div class="t">${esc(nm(w))} ${st}</div><div class="s">${hr > 0 ? _t`${lnum((w.price / hr).toFixed(1))} horas de tu trabajo, ` : ''}${w.status === 'esperando' ? (fits ? 'cabe en tu presupuesto de gustos' : 'no cabe este mes en tus gustos') : ''}</div></div><span class="amt">${M(w.price)}</span>
        <div class="acts">${w.status === 'esperando' ? _t`<button class="btn small soft" data-act="wish-buy" data-id="${w.id}" ${left > 0 ? tr('title="Aún en enfriamiento"') : ''}>Comprar</button><button class="btn small ghost" data-act="wish-drop" data-id="${w.id}">Descartar</button>` : _t`<button class="iconbtn" data-act="wish-delete" data-id="${w.id}" aria-label="Eliminar ${esc(nm(w))}">${icon('close')}</button>`}</div></li>`;
    }).join('')}</ul>` : emptyBox('Tu lista está vacía', 'La próxima vez que quieras algo que no planificaste, anótalo aquí. La mayoría de los antojos desaparecen en pocos días.', _t`<button class="btn" data-act="wish-new">Agregar deseo</button>`)}</section></div>`;
}

  const mk = UI.month;

    const avg = prev.length ? sum(prev, m => monthSummary(ctx, m).byCat[c.id] || 0) / prev.length : null;

    ${groups.length ? _t`<div class="donut-wrap">${svgDonut(dp.segs, { center: fmtC(ms.spent), sub: 'gastado', label: 'Gasto por grupo' })}<div class="legend">${groups.sort((a, b) => b.v - a.v).map(x => _t`<div><span class="dot" style="background:${dp.col(x)}"></span><span>${esc(nm(x.g))}</span><span class="num small">${esc(fmt(x.v))} <span class="faint">${pct(x.v / Math.max(1, ms.spent))}</span></span></div>`).join('')}</div></div>` : _t`<p class="muted">Sin gastos este mes.</p>`}

  let trend;

      ${svgBars(labels, [{ name: 'Ingresos', color: 'var(--c1)', values: sums.map(s => s.income) }, { name: 'Gastos', color: 'var(--c4)', hatch: true, values: sums.map(s => s.spent) }, { name: 'Ahorro', color: 'var(--c3)', values: sums.map(s => s.saved) }], { label: 'Ingresos, gastos y ahorro por mes' })}
      <div class="legend small"><div><span class="dot" style="background:var(--c1)"></span><span>Ingresos</span><span></span></div><div><span class="dot hatch" style="--hc:var(--c4)"></span><span>Gastos</span><span></span></div><div><span class="dot" style="background:var(--c3)"></span><span>Ahorro</span><span></span></div></div>
      <h3>Tasa de ahorro</h3>${svgBars(labels, [{ name: 'Tasa de ahorro', color: 'var(--c1)', values: rates }], { h: 160, minMax: 25, ref: 20, refLabel: _t`Meta: ${pct(0.2)}`, label: 'Tasa de ahorro por mes', fmtY: v => pct(v / 100), fmtTip: v => pct(v / 100) })}

/* =====================================================================
   APP — render, rutas, acciones, formularios, arranque
   ===================================================================== */
'use strict';

let CTX = null;
const VIEWS = { inicio: vInicio, movimientos: vMovimientos, presupuesto: vPresupuesto, metas: vMetas, deudas: vDeudas, inversion: vInversion, pareja: vPareja, fijos: vFijos, deseos: vDeseos, patrimonio: vPatrimonio, san: vSan, informes: vInformes, coach: vCoach, ajustes: vAjustes, planes: vPlanes, mas: vMas };
const hasView = v => typeof v === 'string' && Object.prototype.hasOwnProperty.call(VIEWS, v);

/* ---------- render ---------- */
function applyTheme() {
  const t = S && S.profile.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function captureFocus() {
  const a = document.activeElement;
  if (!a || a === document.body || !$('#app').contains(a)) return null;
  let sel = null;
  if (a.id) sel = '#' + CSS.escape(a.id);
  else if (a.dataset && a.dataset.act) sel = _t`[data-act="${CSS.escape(a.dataset.act)}"]` + (a.dataset.id ? _t`[data-id="${CSS.escape(a.dataset.id)}"]` : '') + (a.dataset.v ? _t`[data-v="${CSS.escape(a.dataset.v)}"]` : '');
  else if (a.getAttribute && a.getAttribute('href')) sel = _t`a[href="${CSS.escape(a.getAttribute('href'))}"]`;
  if (!sel) return null;
  let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch (x) { /* no aplica */ }
  return { sel, s, e };
}
function restoreFocus(f) {
  if (!f) return;
  let el = null;
  try { el = $('#app').querySelector(f.sel); } catch (x) { el = null; }
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (x) { /* no aplica */ }
}
function render() {
  renderTimer = null;
  applyLang();
  if (UI.fatal) { renderFatal(); return; }
  try { renderInner(); } catch (err) { console.error(err); UI.fatal = 'render'; renderFatal(); }
}
function renderFatal() {
  applyTheme();
  const corrupt = UI.fatal === 'corrupt';
  if (UI.fatal === 'newer') {
    $('#app').innerHTML = _t`<main id="main" class="main" tabindex="-1"><section class="panel stack" style="max-width:34rem;margin:2rem auto">
      <h1 class="h-display" style="font-size:1.6rem;margin:0">Hay una versión más nueva de ${esc(CONFIG.APP_NAME)}</h1>
      <p class="muted">Tus datos se guardaron con una versión más reciente de la app. Para no dañarlos, esta versión no los abre. Recarga la página para actualizar; no se ha borrado nada.</p>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn" data-act="reload">Recargar</button><button class="btn ghost" data-act="rescue-backup">Descargar copia de mis datos</button></div>
    </section></main>`;
    return;
  }
  $('#app').innerHTML = _t`<main id="main" class="main" tabindex="-1"><section class="panel stack" style="max-width:34rem;margin:2rem auto">
    <h1 class="h-display" style="font-size:1.6rem;margin:0">${corrupt ? 'Tus datos guardados están dañados' : 'No pudimos abrir tus datos'}</h1>
    <p class="muted">No se ha borrado nada. Descarga la copia de rescate para conservar tu información y luego empieza de nuevo o restaura una copia de seguridad.</p>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn" data-act="rescue-backup">Descargar copia de rescate</button><button class="btn ghost" data-act="rescue-import">Restaurar una copia</button><button class="btn danger" data-act="rescue-reset">Empezar de nuevo</button></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </section></main>`;
}
function renderInner() {
  applyTheme();
  const root = $('#app');
  const f = captureFocus();
  if (!S.onboarded) {
    root.innerHTML = vOnboarding();
    updateObTotals();
    document.title = _t`${CONFIG.APP_NAME}: ${tr(CONFIG.TAGLINE)}`;
    restoreFocus(f);
    return;
  }
  const ctx = makeCtx(S);
  CTX = ctx;
  if (!UI.month) UI.month = ctx.mk;
  // si la app quedó abierta y cambió el mes, las pantallas siguen al mes nuevo
  if (UI.curMk && UI.curMk !== ctx.mk && UI.month === UI.curMk) UI.month = ctx.mk;
  UI.curMk = ctx.mk;
  const v = hasView(UI.view) && !(UI.view === 'coach' && CAPS.checked && !coachAvail()) ? UI.view : 'inicio';
  let content;
  try { content = VIEWS[v](ctx); }
  catch (err) {
    console.error(err);
    content = _t`<section class="panel"><h2>Esta pantalla no se pudo mostrar</h2><p class="muted" style="margin:.4rem 0 1rem">Tus datos están intactos. Descarga una copia de seguridad en Ajustes y vuelve a Inicio.</p><a class="btn" href="#/inicio">Ir a Inicio</a></section>`;
  }
  root.innerHTML = shellHtml(v, content);
  document.title = _t`${CONFIG.APP_NAME}: ${tr(VIEW_TITLES[v] || '')}`;
  restoreFocus(f);
}
let renderTimer = null;
function scheduleRender() { if (!renderTimer) renderTimer = setTimeout(render, 0); }
function commit(fn) {
  fn();
  if (S && S.onboarded) stampIncome();
  snapshotNetWorth();
  persist();
  scheduleRender();
}

/* ---------- toasts ---------- */
function toast(msg, opts) {
  opts = opts || {};
  const r = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.textContent = tr(msg);
  if (opts.undo) {
    const b = document.createElement('button');
    b.textContent = tr('Deshacer');
    b.onclick = () => { opts.undo(); el.remove(); };
    el.appendChild(b);
  }
  r.appendChild(el);
  setTimeout(() => el.remove(), opts.undo ? 6000 : 3200);
}

/* ---------- rutas ---------- */
function route() {
  const v = (location.hash.match(/^#\/([a-z]+)/) || [])[1] || 'inicio';
  const changed = v !== UI.view;
  UI.view = hasView(v) ? v : 'inicio';
  closeModal();
  if (changed) { UI.showAll = false; window.scrollTo(0, 0); }
  render();
  if (changed) { const m = $('#main'); if (m) m.focus({ preventScroll: true }); }
}
function go(v) { if (location.hash === '#/' + v) route(); else location.hash = '#/' + v; }

/* ---------- utilidades de acciones ---------- */
function requirePro(f) { if (isPro()) return true; openModal(paywallModal(f)); return false; }
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
const findById = (arr, id) => arr.find(x => x.id === id);
function catForGoal(g) {
  const grp = g.kind === 'emergencia' ? 'emergencia' : g.kind === 'inversion' ? 'inversion' : 'ahorro';
  return activeCats(S).find(c => c.group === grp && (c.goalId === g.id || !c.goalId)) || activeCats(S).find(c => c.group === grp) || activeCats(S).find(c => GROUP[c.group].kind === 'ahorro');
}
async function saveFile(filename, data) {
  if (CAPS.downloads) {
    try { await CAPS.downloads.save({ filename, data }); toast('Archivo guardado'); }
    catch (e) { if (e && e.code !== 'declined') toast('No se pudo descargar el archivo en esta vista.'); }
    return;
  }
  try {
    const blob = new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { toast('Tu navegador bloqueó la descarga.'); }
}
// Texto que empieza con = + - @ (o tabulador/retorno) se abre como fórmula en Excel: se neutraliza con un apóstrofo. Los números van tal cual.
function csvEscape(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? String(v) : '';
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
/* encabezados y valores del CSV en el idioma de la interfaz (claves propias para no chocar con textos de pantalla) */
const trc = k => { if (LANG === 'es') return k; const v = L[LANG].get('csv.' + k); return v === undefined ? k : v; };
function exportCsv() {
  if (!requirePro('csv')) return;
  const ctx = CTX || makeCtx(S);
  const head = ['fecha', 'tipo', 'grupo', 'categoria', 'nota', 'monto', 'moneda', trc('monto') + '_' + S.profile.currency, 'mi_parte', 'compartido', 'pagado_por'].map(h => trc(h));
  const rows = S.transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t => {
    const c = ctx.catMap.get(t.catId);
    return [t.date, trc(t.type), c ? tr(GROUP[c.group].name) : '', c ? nmRaw(c) : '', txNoteRaw(t), t.amount, t.currency, t.amountBase, round2(txEffective(ctx, t)), trc(t.shared ? 'si' : 'no'), t.shared ? trc(t.paidBy) : ''];
  });
  // donde el decimal es coma, Excel espera ";" como separador y los números con coma
  const comma = decSep() === ',', sep = comma ? ';' : ',';
  const cell = v => (comma && typeof v === 'number' && Number.isFinite(v) ? String(v).replace('.', ',') : csvEscape(v));
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(cell).join(sep)).join('\r\n');
  saveFile(_t`${CONFIG.APP_NAME.toLowerCase()}-movimientos-${todayStr()}.csv`, csv);
}
function loadDemo() {

  S = buildDemoState(UI.ob && isCurrency(UI.ob.currency) ? UI.ob.currency : S && S.profile ? S.profile.currency : 'DOP');

  UI.ob = null; UI.month = null; UI.optimOpen = false; UI.debtExtra = null; UI.coach = { turns: [], busy: false, error: '' };
  persist();
  go('inicio');
  toast('Datos de ejemplo cargados. Puedes borrarlos en Ajustes.');
}

function updateObTotals() {
  const el = $('#ob-ess-total');
  if (!el || !UI.ob) return;
  const ob = UI.ob;
  const st = buildStateFromOb(ob);
  const I = plannedIncome(st).total;
  const tot = sum(OB_ESS, e => parseAmount(ob.ess[e[0]]));
  el.textContent = withState(st, () => tot > 0 ? _t`Total: ${fmt(tot)} al mes${I > 0 ? _t`, ${pct(tot / I)} de tu ingreso para presupuestar (${fmt(I)})` : ''}.` : '');
}

/* ---------- formularios ---------- */
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); toast(msg || 'Copiado'); }
  catch (e) { toast('No se pudo copiar. Mantén presionado el código para copiarlo.'); }
}
let flashTimer = null;
const FORMS = {
  async 'sync-join'(f, fd) {
    const code = syncNormCode(fd.get('code'));
    if (!code) return formError(f, 'El código tiene 20 letras y números, como 7K2QM-8XW4R-…');
    const btn = f.querySelector('.sheet-f .btn:last-child');
    if (btn) { btn.disabled = true; btn.textContent = tr('Conectando…'); }
    try { await Sync.connect(code, false); closeModal(); toast('Conectado. Trayendo tus datos…'); }
    catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = tr('Conectar'); }
      const c = e && e.code;
      return formError(f, c === 'empty' ? 'No encontramos datos con ese código. Revísalo.' : c === 'key' ? 'Ese código no abre estos datos.' : c === 'offline' ? 'Sin conexión. Intenta de nuevo.' : c === 'license' ? 'El servidor pide una licencia Pro.' : 'No se pudo conectar. Intenta de nuevo.');
    }
  },
  tx(f, fd) {
    const type = fd.get('type');
    const amount = parseAmount(fd.get('amount'));
    if (!(amount > 0)) return formError(f, 'Escribe un monto válido, mayor que cero.');
    const date = String(fd.get('date') || '');
    if (!saneDate(date)) return formError(f, 'Elige una fecha válida.');
    let catId = null, goalId = null, sourceId = null;
    if (type === 'gasto') { catId = fd.get('catGasto'); if (!catId) return fieldError(f, 'catGasto', 'Elige una categoría.'); }
    if (type === 'ahorro') {
      catId = fd.get('catAhorro'); if (!catId) return formError(f, 'Elige una categoría de ahorro.');
      goalId = fd.get('goalId') || (findById(S.categories, catId) || {}).goalId || null;
    }
    if (type === 'ingreso') sourceId = fd.get('sourceId') || null;
    const id = f.dataset.id;
    const prev = id ? findById(S.transactions, id) : null;
    let note = String(fd.get('note') || '').trim(), def = null;
    // una nota que puso la app y se muestra traducida se guarda como estaba si no se tocó
    if (prev && prev.note && prev.def === prev.note && note === tr(prev.note)) { note = prev.note; def = prev.def; }
    if (!note && type === 'ingreso' && sourceId) { const src = findById(S.incomes, sourceId); if (src) { note = src.name || ''; if (isDef(src)) def = src.name; } }
    const o = { type, amount, currency: fd.get('currency') || S.profile.currency, date, note, def, catId, goalId, sourceId, shared: type === 'gasto' && fd.get('shared') === 'on', paidBy: fd.get('paidBy'), negative: type === 'ahorro' && fd.get('withdraw') === 'on' };
    // al editar sin cambiar de moneda se conserva la tasa con la que se registró (aunque esa moneda ya no esté configurada)
    const sameCur = !!prev && prev.currency === o.currency && Number(prev.amount) !== 0;
    if (!sameCur && fxMissing(S, o.currency)) return formError(f, _t`Falta la tasa de cambio de ${o.currency}. Ponla en Ajustes, en Multimoneda, y vuelve a guardar.`);
    const newBase = sameCur && o.currency !== S.profile.currency ? round2(amount * Math.abs(prev.amountBase / prev.amount)) : round2(toBase(S, amount, o.currency));
    // pago de deuda editado: no puede superar lo que se debía antes de ese pago
    if (prev && prev.debtId && type === 'gasto') {
      const dd = findById(S.debts, prev.debtId), max = dd ? round2(dd.balance + (Number(prev.amountBase) || 0)) : 0;
      if (dd && newBase > max + 0.005) return formError(f, _t`El pago no puede ser mayor que el saldo (${fmt(max)}). Si pagaste intereses aparte, regístralos como un gasto.`);
    }
    // retiro: no más de lo que hay en la meta (sin contar el propio movimiento que se edita)
    if (o.negative && goalId && CTX) {
      let has = CTX.goalSaved.get(goalId) || 0;
      if (prev && prev.type === 'ahorro' && prev.goalId === goalId) has -= Number(prev.amountBase) || 0;
      if (newBase > has + 0.005) return formError(f, 'No puedes retirar más de lo que hay en la meta.');
    }
    // pago a una deuda dicho en la entrada rápida ("pagué 3,000 a la tarjeta"): baja el saldo, igual que desde Deudas
    let payDebt = null;
    if (!id && type === 'gasto' && fd.get('debtId')) {
      const dd = findById(S.debts, String(fd.get('debtId'))), dc = findById(S.categories, catId);
      if (dd && dc && dc.group === 'deudas') {
        if (newBase > dd.balance + 0.005) return formError(f, _t`El pago no puede ser mayor que el saldo (${fmt(dd.balance)}). Si pagaste intereses aparte, regístralos como un gasto.`);
        payDebt = dd;
      }
    }
    // si el formulario no muestra "compartido" (plan Gratis), un gasto compartido se conserva como estaba
    const hasShare = !!f.querySelector('[name=shared]');
    const pend = !id ? Quick.queue.slice() : [], pendTotal = Quick.total;
    commit(() => {
      if (id) {
        const i = S.transactions.findIndex(x => x.id === id);
        if (i < 0) return;
        const old = S.transactions[i];
        const keep = !hasShare && type === 'gasto' ? { shared: old.shared, paidBy: old.paidBy } : {};
        const nt = makeTx({ ...o, ...keep, id, createdAt: old.createdAt, recurringId: old.recurringId, sanId: old.sanId, sanK: old.sanK, importId: old.importId });
        if (old.currency === nt.currency && nt.currency !== S.profile.currency && old.amount) nt.amountBase = round2(nt.amount * (old.amountBase / old.amount));
        nt.settled = old.settled && nt.shared;
        // pago de deuda: el saldo sigue al movimiento
        if (old.debtId) {
          const d = findById(S.debts, old.debtId);
          const stays = type === 'gasto';
          if (d) d.balance = Math.max(0, round2(d.balance + (Number(old.amountBase) || 0) - (stays ? nt.amountBase : 0)));
          if (stays) nt.debtId = old.debtId;
        }
        S.transactions[i] = nt;
      } else { const nt = makeTx({ ...o, debtId: payDebt ? payDebt.id : null }); if (payDebt) payDebt.balance = Math.max(0, round2(payDebt.balance - nt.amountBase)); S.transactions.push(nt); UI.flashId = nt.id; clearTimeout(flashTimer); flashTimer = setTimeout(() => { UI.flashId = null; }, 2500); }
    });
    closeModal();
    toast(id ? 'Movimiento actualizado' : type === 'gasto' ? _t`Gasto de ${fmt(toBase(S, amount, o.currency))} registrado` : 'Movimiento registrado');
    // varios movimientos en una frase: se confirman uno por uno
    if (pend.length) { openModal(txModal(null, {})); Quick.total = pendTotal; Quick.queue = pend.slice(1); quickApply($('form[data-form="tx"]'), pend[0], pendTotal - pend.length + 1); }
  },
  cat(f, fd) {
    const name = keepName(String(fd.get('name') || '').trim(), findById(S.categories, f.dataset.id));
    if (!name) return formError(f, 'Ponle un nombre.');
    const group = fd.get('group');
    if (!GROUP[group]) return formError(f, 'Elige un grupo.');
    const budget = Math.max(0, parseAmount(fd.get('budget')));
    const id = f.dataset.id;
    if (activeCats(S).some(c => c.id !== id && normTxt(c.name) === normTxt(name))) return formError(f, 'Ya tienes una categoría con ese nombre. Usa otro para no confundirlas.');
    const mk = UI.month || mkOf(todayStr());
    commit(() => {
      let c = id ? findById(S.categories, id) : null;
      if (!c) { c = makeCat(name, group, {}, mk); S.categories.push(c); }
      Object.assign(c, { name, group, kind: GROUP[group].kind, fixed: fd.get('fixed') === 'on', rollover: fd.get('rollover') === 'on' });
      if (c.kind === 'ahorro' && !c.goalId) { const g = S.goals.find(x => (group === 'emergencia' && x.kind === 'emergencia') || (group === 'inversion' && x.kind === 'inversion')); if (g) c.goalId = g.id; }
      setBudget(c.id, mk, budget);
    });
    closeModal(); toast(id ? 'Categoría actualizada' : 'Categoría creada');
  },
  income(f, fd) {
    const name = keepName(String(fd.get('name') || '').trim(), findById(S.incomes, f.dataset.id)) || 'Ingreso';
    const amount = parseAmount(fd.get('amount'));
    if (!(amount > 0)) return formError(f, 'Escribe un monto válido, mayor que cero.');
    const variable = fd.get('variable') === 'on';
    const min = parseAmount(fd.get('min'));
    if (variable && min > amount) return formError(f, 'El mínimo no puede ser mayor que el promedio.');
    const id = f.dataset.id;
    const data = { name, amount, freq: fd.get('freq') || 'mensual', currency: fd.get('currency') || S.profile.currency, variable, min: variable && min > 0 ? min : null };
    if (fxMissing(S, data.currency)) return formError(f, _t`Falta la tasa de cambio de ${data.currency}. Ponla en Ajustes, en Multimoneda.`);
    if (id && !findById(S.incomes, id)) return closeModal();
    commit(() => {
      if (id) Object.assign(findById(S.incomes, id), data);
      else {
        const inc = { id: uid(), ...data };
        S.incomes.push(inc);
        if (fd.get('auto') === 'on' && saneDate(fd.get('next'))) {
          const next = String(fd.get('next'));
          S.recurring.push({ id: uid(), name, type: 'ingreso', amount: variable ? (min > 0 ? min : amount) : amount, currency: data.currency, catId: null, freq: data.freq, nextDate: next, anchorDay: parseDate(next).getDate(), isSub: false, auto: true, active: true, sourceId: inc.id });
          runRecurring();
        }

    closeModal(); toast('Ingreso guardado. Revisa tu presupuesto: el optimizador ya lo tiene en cuenta.');
  },
  goal(f, fd) {
    const id = f.dataset.id;
    const g = id ? findById(S.goals, id) : null;
    const isEF = g && g.kind === 'emergencia';
    const name = isEF ? g.name : keepName(String(fd.get('name') || '').trim(), g);
    if (!name) return formError(f, 'Ponle un nombre a tu meta.');
    const target = parseAmount(fd.get('target'));
    const deadline = String(fd.get('deadline') || '');
    if (!isEF && (!g || g.kind === 'meta') && !(target > 0)) return formError(f, '¿Cuánto necesitas? Escribe un monto.');
    if (deadline && (!saneDate(deadline) || deadline <= todayStr())) return formError(f, 'La fecha límite debe ser en el futuro.');
    commit(() => {
      const initial = Math.max(0, parseAmount(fd.get('initial')));
      if (g) {
        g.name = name; g.initial = initial;
        if (isEF) { g.manual = fd.get('manual') === 'on' && target > 0; g.target = g.manual ? target : 0; }
        else { g.target = target; if (g.kind === 'meta') g.deadline = deadline || null; }
      } else S.goals.push({ id: uid(), name, kind: 'meta', target, initial, deadline: deadline || null, createdAt: todayStr() });
    });
    closeModal(); toast('Meta guardada');
  },
  contrib(f, fd) {
    const g = findById(S.goals, f.dataset.id);
    const amount = parseAmount(fd.get('amount'));
    if (!g) return closeModal();
    if (!(amount > 0)) return formError(f, 'Escribe un monto válido, mayor que cero.');
    const date = String(fd.get('date') || todayStr());
    if (!saneDate(date)) return formError(f, 'Elige una fecha válida.');
    const w = f.dataset.w === '1';
    if (w && CTX && amount > (CTX.goalSaved.get(g.id) || 0) + 0.005) return formError(f, 'No puedes retirar más de lo que hay en la meta.');
    const cat = catForGoal(g);
    if (!cat) return formError(f, 'Crea una categoría de ahorro primero.');
    commit(() => S.transactions.push(makeTx({ type: 'ahorro', amount, negative: w, catId: cat.id, goalId: g.id, date, note: String(fd.get('note') || '').trim() })));
    closeModal(); toast(w ? 'Retiro registrado' : 'Aporte registrado. Un paso más cerca.');
  },
  debt(f, fd) {
    const name = keepName(String(fd.get('name') || '').trim(), findById(S.debts, f.dataset.id)) || 'Deuda';
    const balance = Math.max(0, parseAmount(fd.get('balance')));
    const rateRaw = String(fd.get('rate') || '').trim();
    const rate = rateRaw ? parseDecimal(rateRaw) : 0;
    const minPayment = Math.max(0, parseAmount(fd.get('min')));
    if (!(balance > 0) && !f.dataset.id) return formError(f, 'Escribe el saldo que debes.');
    if (!isFinite(rate) || rate < 0 || rate > 1000) return formError(f, 'Revisa la tasa: debe ser anual y en porcentaje (ej.: 60).');
    if (balance > 0 && minPayment <= 0) return formError(f, 'Escribe el pago mínimo mensual.');
    const id = f.dataset.id;
    let raised = 0;
    commit(() => {
      if (id) { const cur = findById(S.debts, id); if (!cur) return; Object.assign(cur, { name, balance, rate, minPayment }); }
      else S.debts.push({ id: uid(), name, balance, rate, minPayment });
      const dc = activeCats(S).find(c => c.group === 'deudas');
      const mins = sum(S.debts.filter(d => d.balance > 0), d => d.minPayment);
      if (dc && budgetFor(S, dc.id, mkOf(todayStr())) < mins) { setBudget(dc.id, mkOf(todayStr()), mins); raised = mins; }

    UI.debtExtra = null;
    closeModal(); toast(raised ? _t`Deuda guardada. Subimos tu presupuesto de pagos de deudas a ${fmt(raised)} para cubrir los mínimos; revisa el resto en Presupuesto.` : 'Deuda guardada');
  },
  debtpay(f, fd) {
    const d = findById(S.debts, f.dataset.id);
    const amount = parseAmount(fd.get('amount'));
    if (!d) return closeModal();
    if (!(amount > 0)) return formError(f, 'Escribe un monto válido, mayor que cero.');

    if (!saneDate(date)) return formError(f, 'Elige una fecha válida.');

    const dc = activeCats(S).find(c => c.group === 'deudas');
    commit(() => {
      S.transactions.push(makeTx({ type: 'gasto', amount, catId: dc ? dc.id : null, date, note: '', debtId: d.id }));
      d.balance = Math.max(0, round2(d.balance - amount));

  san(f, fd) {
    const id = f.dataset.id, old = id ? findById(S.sans, id) : null;
    const name = String(fd.get('name') || '').trim();
    if (!name) return fieldError(f, 'name', 'Ponle un nombre.');
    const amount = parseAmount(fd.get('amount'));
    if (!(amount > 0)) return fieldError(f, 'amount', 'Escribe un monto válido, mayor que cero.');
    const turns = parseInt(String(fd.get('turns') || '').trim(), 10), myTurn = parseInt(String(fd.get('myTurn') || '').trim(), 10);
    if (!(turns >= 2 && turns <= 120) || String(turns) !== String(fd.get('turns')).trim()) return fieldError(f, 'turns', 'Pon cuántos turnos tiene el san: entre 2 y 120.');
    if (!(myTurn >= 1 && myTurn <= turns) || String(myTurn) !== String(fd.get('myTurn')).trim()) return fieldError(f, 'myTurn', _t`Tu turno va del 1 al ${turns}.`);
    const start = String(fd.get('start') || '');
    if (!saneDate(start)) return fieldError(f, 'start', 'Elige una fecha válida.');
    const feeRaw = String(fd.get('fee') || '').trim(), fee = feeRaw ? amountOrNaN(feeRaw) : 0;
    if (!isFinite(fee) || fee < 0 || fee >= amount * turns) return fieldError(f, 'fee', 'La comisión debe ser menor que lo que se recibe.');
    const currency = fd.get('currency') || S.profile.currency;
    if (fxMissing(S, currency)) return formError(f, _t`Falta la tasa de cambio de ${currency}. Ponla en Ajustes, en Multimoneda, y vuelve a guardar.`);
    const freq = SAN_FREQS.includes(fd.get('freq')) ? fd.get('freq') : 'mensual';
    if (old && sanInfo(old, S.transactions).paid > turns) return fieldError(f, 'turns', 'Ya registraste más aportes que esos turnos.');
    if (!old && sanFreeFull()) { openModal(paywallModal('circles')); return; }
    const data = { name, amount, currency, freq, turns, myTurn, start, organizer: String(fd.get('organizer') || '').trim().slice(0, 60), fee };
    commit(() => { if (old) Object.assign(old, data); else S.sans.push({ id: uid(), ...data, received: null, createdAt: Date.now() }); });
    closeModal(); toast(old ? 'San actualizado' : 'San guardado');
  },
  loan(f, fd) {
    const id = f.dataset.id, old = id ? findById(S.loans, id) : null;
    const dir = fd.get('dir') === 'debo' ? 'debo' : 'medeben';
    const person = String(fd.get('person') || '').trim();
    if (!person) return fieldError(f, 'person', 'Escribe el nombre de la persona.');
    const amount = parseAmount(fd.get('amount'));
    if (!(amount > 0)) return fieldError(f, 'amount', 'Escribe un monto válido, mayor que cero.');
    const date = String(fd.get('date') || ''), due = String(fd.get('due') || '');
    if (!saneDate(date)) return fieldError(f, 'date', 'Elige una fecha válida.');
    if (due && !saneDate(due)) return fieldError(f, 'due', 'Elige una fecha válida.');

    deudas: S.debts.filter(d => d.balance > 0).map(d => ({ nombre: d.name, saldo: Math.round(d.balance), tasa_anual: d.rate, minimo: Math.round(d.minPayment) })),
    metas: S.goals.filter(g => g.kind === 'meta').map(g => { const gi = goalInfo(ctx, g); return { nombre: g.name, meta: Math.round(gi.target), ahorrado: Math.round(gi.saved), fecha: g.deadline, necesita_al_mes: Math.round(gi.monthly) }; }),
    salud_financiera: hs ? { puntuacion: hs.score, nivel: hs.label, partes: hs.parts.map(p => _t`${p.label}: ${Math.round(p.score)}/${p.max} (${p.detail})`) } : null,

async function coachAsk(q) {
  q = String(q || '').trim().slice(0, 800);
  if (!q || UI.coach.busy) return;
  if (!CAPS.sample && !CONFIG.AI_PROXY_URL) { UI.coach.error = 'El Coach no está disponible en este momento.'; render(); return; }
  UI.coach.turns.push({ role: 'user', content: q });
  UI.coach.busy = true; UI.coach.error = ''; UI.coach.live = '';
  render();
  const rules = _t`Eres el coach financiero de la app ${CONFIG.APP_NAME}. Responde en español, en tono cercano y directo, en máximo 180 palabras, pensado para leer en el celular. Usa los números reales del usuario (datos abajo, montos en ${S.profile.currency}) y da pasos concretos con cifras. No inventes datos que no estén. Si algo depende de información que falta, dilo en una línea. No recomiendes productos financieros específicos por nombre. Si la pregunta es de inversión, impuestos o temas legales importantes, recuerda en una frase que es orientación educativa.\n\nDATOS DEL USUARIO (JSON):\n${JSON.stringify(coachSnapshot(CTX))}`;
  // historial válido: alterna usuario/asistente, empieza y termina en usuario
  const merged = [];
  for (const t of UI.coach.turns.slice(-10)) {
    const last = merged[merged.length - 1];
    if (last && last.role === t.role) last.content += '\n\n' + t.content; else merged.push({ role: t.role, content: t.content });
  }
  while (merged.length && merged[0].role !== 'user') merged.shift();
  const history = merged;
  try {
    let text = '';
    if (CAPS.sample) {
      const turns = [{ role: 'user', content: rules }, { role: 'assistant', content: 'Entendido. Tengo tus datos y responderé con base en ellos.' }, ...history];
      const res = await CAPS.sample(turns, { cache: false, onText: ({ text: t }) => { UI.coach.live = t; const el = document.getElementById('coach-live'); if (el) el.textContent = t; } });
      text = res.text;
    } else {
      const r = await fetch(CONFIG.AI_PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ system: rules, messages: history }) });
      if (!r.ok) throw { code: 'http' };
      const j = await r.json();
      text = j.text || '';
    }
    UI.coach.turns.push({ role: 'assistant', content: String(text).trim() || 'No obtuve respuesta. Intenta de nuevo.' });
  } catch (e) {
    const code = e && e.code;
    if (e && e.text) UI.coach.turns.push({ role: 'assistant', content: e.text });
    UI.coach.error = code === 'not_granted' ? 'Para usar el coach, permite que la app consulte al asistente.' : code === 'rate_limited' ? 'Demasiadas preguntas seguidas. Espera un momento.' : code === 'cancelled' ? '' : 'No se pudo conectar con el asistente. Intenta de nuevo.';
  } finally {
    UI.coach.busy = false; UI.coach.live = '';
    render();
  }
}

/* ---------- arranque ---------- */
function boot() {
  let n = 0;
  try {
    const loaded = Store.load();
    // datos guardados por una versión más nueva: no se tocan ni se reescriben
    if (isNewerSchema(loaded)) { S = emptyState(); UI.fatal = 'newer'; }
    else S = loaded ? migrate(loaded) : emptyState();
    if (!loaded || Store.corrupt) S.plan = PlanKeep.current(); // el plan del dispositivo no depende de los datos
    Sync.init(); // línea base: lo que cambie desde aquí se sella para sincronizar
    if (UI.fatal) { /* nada que preparar */ }
    else if (Store.corrupt) UI.fatal = 'corrupt';
    else if (S.onboarded) {
      linkCoreGoals(S);
      ensureMonthSnapshot();
      n = runRecurring();
      snapshotNetWorth();
