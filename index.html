/*I18N-END*//*I18N-DICT*/

const GROUPS = [
  { id: 'esenciales', name: 'Esenciales',          color: 'var(--g-esenciales)', kind: 'gasto', life: false },
  { id: 'deudas',     name: 'Deudas',              color: 'var(--g-deudas)', kind: 'gasto', life: false },
  { id: 'familia',    name: 'Familia',             color: 'var(--g-familia)', kind: 'gasto', life: true  },
  { id: 'pareja',     name: 'Pareja',              color: 'var(--g-pareja)', kind: 'gasto', life: true  },
  { id: 'personal',   name: 'Personal',            color: 'var(--g-personal)', kind: 'gasto', life: true  },
  { id: 'diversion',  name: 'Diversión',           color: 'var(--g-diversion)', kind: 'gasto', life: true  },
  { id: 'hobbies',    name: 'Hobbies',             color: 'var(--g-hobbies)', kind: 'gasto', life: true  },
  { id: 'emergencia', name: 'Fondo de emergencia', color: 'var(--g-emergencia)', kind: 'ahorro', life: false },
  { id: 'ahorro',     name: 'Ahorro y metas',      color: 'var(--g-ahorro)', kind: 'ahorro', life: false },
  { id: 'inversion',  name: 'Inversión',           color: 'var(--g-inversion)', kind: 'ahorro', life: false },
];
const GROUP = Object.fromEntries(GROUPS.map(g => [g.id, g]));
const LIFE_WEIGHTS = { familia: 0.18, pareja: 0.17, personal: 0.25, diversion: 0.22, hobbies: 0.18 };
const FREQS = {
  semanal:   { label: 'Semanal',   m: 52 / 12 },
  quincenal: { label: 'Quincenal', m: 2 },
  mensual:   { label: 'Mensual',   m: 1 },
  trimestral:{ label: 'Trimestral',m: 1 / 3 },
  anual:     { label: 'Anual',     m: 1 / 12 },
};
// Referencias de peso sobre el ingreso (buenas prácticas de finanzas personales)
const BENCH = { vivienda: 0.30, comida: 0.15, transporte: 0.15, servicios: 0.10 };
const HIGH_RATE = 10; // % anual a partir del cual una deuda se considera cara

/* ---------- utilidades numéricas ---------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;

/* ---------- fechas locales (sin desfases de zona horaria) ---------- */
const pad2 = n => String(n).padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => dateStr(new Date());
const parseDate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const mkOf = s => String(s).slice(0, 7);
const isMkStr = v => typeof v === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(v);
const mkAdd = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
const daysIn = mk => { const [y, m] = mk.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); };
const diffDays = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const monthsUntil = (from, to) => { const a = parseDate(from), b = parseDate(to); let n = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); if (b.getDate() > a.getDate()) n += 1; return Math.max(1, n); };
// Fecha real del calendario (rechaza 2026-02-31, 0000-00-00, números y objetos)
const isValidDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && +s.slice(0, 4) >= 1900 && +s.slice(0, 4) <= 2200 && dateStr(parseDate(s)) === s;

function nextByFreq(s, freq, anchor) {
  const d = parseDate(s);
  if (freq === 'semanal') return addDays(s, 7);
  if (freq === 'quincenal') {
    const mk = mkOf(s), last = daysIn(mk), day = d.getDate();
    if (day < 15) return `${mk}-15`;
    if (day < last) return `${mk}-${pad2(last)}`;
    return `${mkAdd(mk, 1)}-15`;
  }
  const n = freq === 'anual' ? 12 : freq === 'trimestral' ? 3 : 1;
  const mk2 = mkAdd(mkOf(s), n);
  const a = Number(anchor) || d.getDate();
  return `${mk2}-${pad2(Math.min(a, daysIn(mk2)))}`;
}
const toMonthly = (amt, f) => (Number(amt) || 0) * (FREQS[f] ? FREQS[f].m : 1);

/* ---------- RNG reproducible (mulberry32) + normal ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function normalGen(rnd) {
  let spare = null;
  return () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0;
    while (u <= Number.EPSILON) u = rnd();
    v = rnd();
    const r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
}

/* ---------- moneda ---------- */
function toBase(state, amount, cur) {
  const base = state.profile.currency;
  const a = Number(amount) || 0;
  if (!cur || cur === base) return a;
  const r = Number(state.profile.fx && state.profile.fx[cur]);
  return r > 0 ? a * r : a;
}

// ¿Falta la tasa de cambio de esta moneda? (nunca se debe guardar un monto así)
function fxMissing(state, cur) {
  const base = state.profile.currency;
  if (!cur || cur === base) return false;
  return !(Number(state.profile.fx && state.profile.fx[cur]) > 0);
}

/* ---------- ingresos planificados ---------- */
function plannedIncome(state) {
  let total = 0, avgTotal = 0, variableAvg = 0;
  const items = [];
  for (const s of state.incomes || []) {
    const avgAmt = Number(s.amount) || 0;
    const conservative = s.variable ? (Number(s.min) > 0 ? Number(s.min) : avgAmt * 0.7) : avgAmt;
    const monthly = toMonthly(toBase(state, conservative, s.currency), s.freq);
    const monthlyAvg = toMonthly(toBase(state, avgAmt, s.currency), s.freq);
    total += monthly; avgTotal += monthlyAvg;
    if (s.variable) variableAvg += monthlyAvg;
    items.push({ ...s, monthly, monthlyAvg, conservativeAuto: s.variable && !(Number(s.min) > 0) });
  }
  return { total, avgTotal, variableShare: avgTotal > 0 ? variableAvg / avgTotal : 0, items };
}

/* ---------- contexto derivado (se calcula una vez por render) ---------- */
function activeCats(state) { return state.categories.filter(c => !c.archived); }

function makeCtx(state, today) {
  today = today || todayStr();
  const byMonth = new Map();
  for (const t of state.transactions) {
    const mk = mkOf(t.date);
    if (!byMonth.has(mk)) byMonth.set(mk, []);
    byMonth.get(mk).push(t);
  }
  for (const arr of byMonth.values()) arr.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const catMap = new Map(state.categories.map(c => [c.id, c]));
  const inc = plannedIncome(state);
  const goalSaved = new Map();
  for (const g of state.goals) goalSaved.set(g.id, Number(g.initial) || 0);
  for (const t of state.transactions) {
    if (t.type === 'ahorro' && !t.sanId && t.goalId && goalSaved.has(t.goalId)) goalSaved.set(t.goalId, goalSaved.get(t.goalId) + (Number(t.amountBase) || 0));
  }
  const ctx = { state, today, mk: mkOf(today), byMonth, months: [...byMonth.keys()].sort(), catMap, inc, goalSaved, cache: new Map() };
  ctx.share = myShare(ctx);
  return ctx;
}

function myShare(ctx) {
  const st = ctx.state, c = st.couple || {};
  if (!st.profile.hasPartner) return 1;
  if (c.splitMode === '50-50') return 0.5;
  if (c.splitMode === 'personalizado') return clamp((Number.isFinite(Number(c.myPct)) && c.myPct !== null && c.myPct !== '' ? Number(c.myPct) : 50) / 100, 0, 1);
  const mine = ctx.inc.avgTotal, theirs = Number(c.partnerIncome) || 0;
  if (theirs <= 0 || mine <= 0) return 0.5; // sin datos de ambos: mitad y mitad
  return mine / (mine + theirs);
}

function txEffective(ctx, t) {
  const a = Number(t.amountBase) || 0;
  return t.type === 'gasto' && t.shared ? a * ctx.share : a;
}

function monthSummary(ctx, mk) {
  if (ctx.cache.has(mk)) return ctx.cache.get(mk);
  const txs = ctx.byMonth.get(mk) || [];
  const byCat = {}, byGroup = {};
  let income = 0, spent = 0, saved = 0;
  for (const t of txs) {
    const e = txEffective(ctx, t);
    if (t.type === 'ingreso') { income += e; continue; }
    if (t.type === 'gasto') spent += e; else if (t.type === 'ahorro') saved += e; else continue;
    byCat[t.catId] = (byCat[t.catId] || 0) + e;
    const c = ctx.catMap.get(t.catId);
    const g = c ? c.group : 'otros';
    byGroup[g] = (byGroup[g] || 0) + e;
  }
  const r = { mk, income, spent, saved, byCat, byGroup, count: txs.length };
  ctx.cache.set(mk, r);
  return r;
}

function budgetFor(state, catId, mk) {
  const h = state.budgetHistory && state.budgetHistory[mk];
  if (h && Object.prototype.hasOwnProperty.call(h, catId)) return Number(h[catId]) || 0;
  const cat = state.categories.find(c => c.id === catId);
  return cat ? Number(cat.budget) || 0 : 0;
}

function carryFor(ctx, cat, mk) {
  if (!cat.rollover || GROUP[cat.group]?.kind !== 'gasto') return 0;
  const first = cat.createdMonth || ctx.months[0] || mk;
  let m = mkAdd(mk, -24);
  if (m < first) m = first;
  let run = 0;
  while (m < mk) {
    const b = budgetFor(ctx.state, cat.id, m);
    const s = monthSummary(ctx, m).byCat[cat.id] || 0;
    run = Math.max(0, run + b - s);
    m = mkAdd(m, 1);
  }
  return run;
}

function catStatus(ctx, cat, mk) {
  const budget = budgetFor(ctx.state, cat.id, mk);
  const carry = carryFor(ctx, cat, mk);
  const spent = monthSummary(ctx, mk).byCat[cat.id] || 0;
  const avail = budget + carry - spent;
  const base = budget + carry;
  const pct = base > 0 ? spent / base : (spent > 0 ? 9 : 0);
  const state = GROUP[cat.group]?.kind === 'ahorro' ? (pct >= 1 ? 'ok' : 'ahorro') : pct > 1.0001 ? 'over' : pct >= 0.8 && !cat.fixed ? 'warn' : 'ok';
  return { budget, carry, spent, avail, pct, state };
}

function monthTotals(ctx, mk) {
  let assigned = 0, assignedSave = 0, assignedSpend = 0;
  for (const c of activeCats(ctx.state)) {
    const b = budgetFor(ctx.state, c.id, mk);
    assigned += b;
    if (GROUP[c.group]?.kind === 'ahorro') assignedSave += b; else assignedSpend += b;
  }
  // los meses pasados conservan el ingreso planificado que tenían: cambiar el ingreso hoy no reescribe la historia
  const ih = ctx.state.incomeHistory;
  const I = mk < ctx.mk && ih && Number.isFinite(Number(ih[mk])) && ih[mk] !== null ? Number(ih[mk]) : ctx.inc.total;
  return { I, assigned, assignedSave, assignedSpend, unassigned: I - assigned };
}

/* ---------- "Puedes gastar hoy" ---------- */
function safeToSpend(ctx) {
  const mk = ctx.mk, day = parseDate(ctx.today).getDate(), dim = daysIn(mk);
  const left = dim - day + 1;
  let flexBudget = 0, flexSpent = 0, spentToday = 0;
  const flexIds = new Set();
  for (const c of activeCats(ctx.state)) {
    if (GROUP[c.group]?.kind !== 'gasto' || c.fixed || c.rollover) continue;
    flexIds.add(c.id);
    const st = catStatus(ctx, c, mk);
    flexBudget += st.budget + st.carry;
    flexSpent += st.spent;
  }
  for (const t of ctx.byMonth.get(mk) || []) {
    if (t.type === 'gasto' && t.date === ctx.today && flexIds.has(t.catId)) spentToday += txEffective(ctx, t);
  }
  const net = flexBudget - flexSpent;
  const startNet = net + spentToday;
  const allowance = Math.max(0, startNet) / left;
  const todayLeft = allowance - spentToday;
  const tomorrow = left > 1 ? Math.max(0, net) / (left - 1) : 0;
  return { today: todayLeft, allowance, net, left, day, dim, flexBudget, flexSpent, spentToday, tomorrow };
}

/* ---------- Fondo de emergencia ---------- */
function efStatus(ctx) {
  const st = ctx.state, mk = ctx.mk;
  // Un mes de gastos esenciales = esenciales + pagos mínimos de deuda (no el extra que el plan manda a deudas)
  let M = 0, debtBudget = 0;
  for (const c of activeCats(st)) { if (c.group === 'esenciales') M += budgetFor(st, c.id, mk); else if (c.group === 'deudas') debtBudget += budgetFor(st, c.id, mk); }
  const openDebts = st.debts.filter(d => Number(d.balance) > 0);
  M += openDebts.length ? sum(openDebts, d => d.minPayment) : debtBudget;
  if (M <= 0) M = ctx.inc.total * 0.6;
  const vs = ctx.inc.variableShare;
  let T = 3 + (vs > 0.5 ? 3 : vs > 0.2 ? 1.5 : 0) + ((Number(st.profile.dependents) || 0) > 0 ? 1 : 0);
  T = Math.min(9, Math.round(T * 2) / 2);
  if (Number(st.profile.efMonths) > 0) T = Number(st.profile.efMonths);
  const goal = st.goals.find(g => g.kind === 'emergencia');
  const F = goal ? Math.max(0, ctx.goalSaved.get(goal.id) || 0) : 0;
  const target = goal && goal.manual && Number(goal.target) > 0 ? Number(goal.target) : M * T;
  return { M, T, F, target, coverage: M > 0 ? F / M : 0, gap: Math.max(0, target - F), goal, pct: target > 0 ? clamp(F / target, 0, 1) : 0 };
}

/* ---------- Metas ---------- */
function goalTarget(ctx, g) { return g.kind === 'emergencia' ? efStatus(ctx).target : Number(g.target) || 0; }
function goalInfo(ctx, g) {
  const saved = ctx.goalSaved.get(g.id) || 0;
  const target = goalTarget(ctx, g);
  const rem = Math.max(0, target - saved);
  let monthly = 0, months = null;
  if (rem > 0 && g.deadline && isValidDate(g.deadline)) {
    months = diffDays(ctx.today, g.deadline) > 0 ? monthsUntil(ctx.today, g.deadline) : 1;
    monthly = rem / months;
  }
  // ritmo real: aportes netos de los últimos 3 meses completos + actual
  let recent = 0;
  const from = mkAdd(ctx.mk, -2);
  for (const t of ctx.state.transactions) if (t.type === 'ahorro' && t.goalId === g.id && mkOf(t.date) >= from) recent += Number(t.amountBase) || 0;
  // se divide entre los meses realmente transcurridos (una meta nueva no puede ir "atrasada" por no tener historia)
  const since = g.createdAt && isValidDate(g.createdAt) && g.createdAt > from + '-01' ? g.createdAt : from + '-01';
  const elapsed = clamp((diffDays(since, ctx.today) + 1) / 30.44, 1, 3);
  const pace = recent / elapsed;
  const eta = rem <= 0 ? 0 : pace > 0 ? Math.ceil(rem / pace) : null;
  const late = months != null && eta != null && eta > months;
  return { saved, target, rem, monthly, months, pace, eta, late, pct: target > 0 ? clamp(saved / target, 0, 1) : 0 };
}

/* ---------- Deudas ---------- */
function simulateDebts(debts, extra, strategy) {
  const ds = (debts || []).filter(d => Number(d.balance) > 0).map(d => ({
    id: d.id, name: d.name, def: d.def, bal: Number(d.balance), r: (Number(d.rate) || 0) / 100 / 12, min: Math.max(0, Number(d.minPayment) || 0), paid: null,
  }));
  if (!ds.length) return { months: 0, interest: 0, order: [], series: [0], never: false, budget: 0 };
  const minsOnly = strategy === 'minimos';
  const fixedBudget = sum(ds, d => d.min) + (minsOnly ? 0 : Math.max(0, Number(extra) || 0));
  let month = 0, interest = 0, never = false;
  const series = [sum(ds, d => d.bal)], order = [];
  while (ds.some(d => d.bal > 0.005) && month < 600) {
    month++;
    let mInt = 0;
    for (const d of ds) if (d.bal > 0) { const i = d.bal * d.r; d.bal += i; interest += i; mInt += i; }
    let pool = minsOnly ? sum(ds.filter(d => d.bal > 0), d => d.min) : fixedBudget;
    if (month === 1) {
      if (minsOnly ? ds.some(d => d.min <= d.bal * d.r / (1 + d.r) + 1e-9 && d.bal > 0) : pool <= mInt + 1e-9) { never = true; }
    }
    for (const d of ds) if (d.bal > 0) { const p = Math.min(d.min, d.bal, pool); d.bal -= p; pool -= p; }
    if (!minsOnly) {
      const targets = ds.filter(d => d.bal > 0.005).sort(strategy === 'avalancha'
        ? (a, b) => b.r - a.r || a.bal - b.bal
        : (a, b) => a.bal - b.bal || b.r - a.r);
      for (const d of targets) { if (pool <= 0) break; const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; }
    }
    for (const d of ds) if (d.bal <= 0.005 && d.paid === null) { d.bal = 0; d.paid = month; order.push({ name: d.name, def: d.def, month }); }
    series.push(sum(ds, d => d.bal));
    if (never) break;
  }
  if (ds.some(d => d.bal > 0.005)) never = true;
  return { months: never ? Infinity : month, interest, order, series, never, budget: fixedBudget };
}

/* ---------- Inversión ---------- */
function fvAnnuity(pmt, annualRate, years, initial = 0) {
  const i = Math.pow(1 + annualRate, 1 / 12) - 1, n = Math.round(years * 12);
  if (Math.abs(i) < 1e-12) return initial + pmt * n;
  return initial * Math.pow(1 + i, n) + pmt * (Math.pow(1 + i, n) - 1) / i;
}

function monteCarlo(p) {
  const sims = clamp(Math.round(p.sims || 2000), 100, 10000);
  const years = clamp(Math.round(p.years || 20), 1, 60);
  const mu = Number(p.mu), sigma = Math.max(0, Number(p.sigma)), infl = Number(p.inflation) || 0;
  const growth = Number(p.growth) || 0;
  const rnd = mulberry32((p.seed || 20260920) >>> 0), z = normalGen(rnd);
  const drift = (Math.log(1 + mu) - sigma * sigma / 2) / 12, sd = sigma / Math.sqrt(12);
  const yearly = Array.from({ length: years + 1 }, () => new Float64Array(sims));
  for (let s = 0; s < sims; s++) {
    let v = Number(p.initial) || 0, c = Number(p.monthly) || 0;
    yearly[0][s] = v;
    for (let y = 1; y <= years; y++) {
      for (let m = 0; m < 12; m++) { v = v * Math.exp(drift + sd * z()) + c; }
      c *= 1 + growth;
      yearly[y][s] = v;
    }
  }
  const q = (arr, pr) => arr[Math.min(arr.length - 1, Math.max(0, Math.floor(pr * (arr.length - 1))))];
  const bands = [];
  let contributed = Number(p.initial) || 0, cc = Number(p.monthly) || 0;
  let contribReal = contributed, mIdx = 0;
  const realContrib = [];
  const det = [];
  let dv = Number(p.initial) || 0;
  const im = Math.pow(1 + mu, 1 / 12) - 1;
  for (let y = 0; y <= years; y++) {
    const defl = p.real ? Math.pow(1 + infl, y) : 1;
    const arr = Array.from(yearly[y]).sort((a, b) => a - b);
    realContrib.push(contribReal);
    bands.push({ y, p10: q(arr, .10) / defl, p25: q(arr, .25) / defl, p50: q(arr, .50) / defl, p75: q(arr, .75) / defl, p90: q(arr, .90) / defl, contrib: p.real ? contribReal : contributed, det: dv / defl });
    if (y < years) {
      for (let m = 0; m < 12; m++) { dv = dv * (1 + im) + cc; contributed += cc; mIdx++; contribReal += cc / Math.pow(1 + infl, mIdx / 12); }
      cc *= 1 + growth;
    }
  }
  const last = Array.from(yearly[years]);
  const deflLast = p.real ? Math.pow(1 + infl, years) : 1;
  const target = Number(p.target) || 0;
  const probTarget = target > 0 ? last.filter(v => v / deflLast >= target).length / sims : null;
  const probLoss = last.filter(v => v / deflLast < bands[years].contrib).length / sims;
  return { bands, probTarget, probLoss, sims, years };
}

function fireInfo(ctx, mu = 0.08, infl = 0.04) {
  const st = ctx.state, mk = ctx.mk;
  let spend = 0, invest = 0;
  for (const c of activeCats(st)) {
    const b = budgetFor(st, c.id, mk);
    if (GROUP[c.group]?.kind === 'gasto' && c.group !== 'deudas') spend += b; else if (c.group === 'inversion') invest += b;
  }
  const annual = spend * 12;
  const number = annual * 25;
  const invGoal = st.goals.find(g => g.kind === 'inversion');
  let current = invGoal ? ctx.goalSaved.get(invGoal.id) || 0 : 0;
  current += sum(st.assets.filter(a => a.kind === 'activo' && a.type === 'inversion'), a => a.value);
  const rReal = Math.pow((1 + mu) / (1 + infl), 1 / 12) - 1;
  let v = current, months = 0;
  if (number > 0) while (v < number && months < 1200) { v = v * (1 + rReal) + invest; months++; }
  return { annual, number, current, invest, months: number > 0 && v >= number ? months : null, pct: number > 0 ? clamp(current / number, 0, 1) : 0 };
}

/* ---------- Pareja ---------- */
function coupleBalance(ctx) {
  let iPaidForThem = 0, theyPaidForMe = 0, total = 0, count = 0;
  for (const t of ctx.state.transactions) {
    if (t.type !== 'gasto' || !t.shared || t.settled) continue;
    const a = Number(t.amountBase) || 0;
    total += a; count++;
    if (t.paidBy === 'pareja') theyPaidForMe += a * ctx.share; else iPaidForThem += a * (1 - ctx.share);
  }
  return { net: iPaidForThem - theyPaidForMe, iPaidForThem, theyPaidForMe, total, count, share: ctx.share };
}

/* ---------- Patrimonio ---------- */
function netWorth(ctx) {
  const st = ctx.state;
  const assets = sum(st.assets.filter(a => a.kind === 'activo'), a => a.value);
  const liab = sum(st.assets.filter(a => a.kind === 'pasivo'), a => a.value) + sum(st.debts, d => d.balance);
  let goals = sum(st.goals, g => ctx.goalSaved.get(g.id) || 0);
  // ahorro sin meta (o de una meta que se eliminó): sigue siendo dinero tuyo
  let loose = 0;
  // los aportes a un san no son "ahorro suelto": se cuentan aparte, como lo que el grupo te debe
  for (const t of st.transactions) if (t.type === 'ahorro' && !t.sanId && !(t.goalId && ctx.goalSaved.has(t.goalId))) loose += Number(t.amountBase) || 0;
  loose = Math.max(0, loose);
  goals += loose;
  // entre personas: lo que te deben (salvo lo que marcaste como dudoso) suma; lo que debes resta
  const pb = peopleBalance(st, ctx.today);
  const receivable = round2(pb.owed + pb.sanAsset), payable = round2(pb.owe + pb.sanLiab);
  return { assets, liab, goals, loose, receivable, payable, doubtful: pb.owedDoubt, people: pb, total: assets + goals + receivable - liab - payable };
}

/* ---------- Detección de suscripciones y duplicados ---------- */
const normTxt = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function detectSubscriptions(ctx) {
  const groups = new Map();
  for (const t of ctx.state.transactions) {
    if (t.type !== 'gasto' || t.recurringId || !t.note) continue;
    const n = normTxt(t.note);
    if (n.length < 3) continue;
    const key = n + '|' + Math.round(Number(t.amountBase) || 0);
    if (!groups.has(key)) groups.set(key, { name: t.note, def: t.def, amount: Number(t.amountBase) || 0, catId: t.catId, months: new Set(), count: 0 });
    const g = groups.get(key); g.months.add(mkOf(t.date)); g.count++;
  }
  const known = new Set(ctx.state.recurring.map(r => normTxt(r.name)));
  // un pago fijo aparece en 3 meses o más y como mucho una vez por mes
  return [...groups.values()].filter(g => g.months.size >= 3 && g.count <= g.months.size && !known.has(normTxt(g.name))).map(g => ({ ...g, months: g.months.size }));
}
function detectDuplicates(ctx, mk) {
  const seen = new Map(), dups = [];
  for (const t of ctx.byMonth.get(mk) || []) {
    const k = [t.type, t.date, t.catId, Math.round((Number(t.amountBase) || 0) * 100), normTxt(t.note)].join('|');
    if (seen.has(k)) dups.push([seen.get(k), t]); else seen.set(k, t);
  }
  return dups;
}

/* ---------- Puntuación de salud financiera (0-100) ---------- */
function healthScore(ctx) {
  const st = ctx.state, I = ctx.inc.total, mk = ctx.mk;
  if (I <= 0) return null;
  const cats = activeCats(st);
  const saveB = sum(cats.filter(c => GROUP[c.group]?.kind === 'ahorro'), c => budgetFor(st, c.id, mk));
  const invB = sum(cats.filter(c => c.group === 'inversion'), c => budgetFor(st, c.id, mk));
  const rate = saveB / I;
  const ef = efStatus(ctx);
  const debts = st.debts.filter(d => d.balance > 0);
  // un san ya recibido es deuda: sus aportes pesan como un pago mínimo más
  const sanDue = peopleBalance(st, ctx.today).sanMonthly;
  const dti = (sum(debts, d => d.minPayment) + sanDue) / I;
  const high = debts.some(d => (Number(d.rate) || 0) >= HIGH_RATE);
  const parts = [];
  parts.push({ key: 'ahorro', label: 'Tasa de ahorro', max: 25, score: 25 * clamp(rate / 0.20, 0, 1), detail: _t`${Math.round(rate * 100)}% de tu ingreso va a ahorro e inversión (meta: 20%)` });
  parts.push({ key: 'colchon', label: 'Fondo de emergencia', max: 25, score: 25 * clamp(ef.T > 0 ? ef.coverage / ef.T : 0, 0, 1), detail: _t`Cubres ${lnum(ef.coverage.toFixed(1))} de ${lnum(ef.T)} meses de gastos esenciales` });
  let dScore = 20 * clamp((0.40 - dti) / 0.30, 0, 1);
  if (high) dScore = Math.max(0, dScore - 6);
  parts.push({ key: 'deuda', label: 'Carga de deudas', max: 20, score: dScore, detail: debts.length || sanDue > 0 ? _t`Tus pagos mínimos son ${Math.round(dti * 100)}% del ingreso${high ? '; tienes deuda cara' : ''}` : 'Sin deudas registradas' });
  const withBudget = cats.filter(c => GROUP[c.group]?.kind === 'gasto' && budgetFor(st, c.id, mk) > 0);
  const ms = monthSummary(ctx, mk);
  let adh, adhDetail;
  if (!ms.count || !withBudget.length) { adh = 7.5; adhDetail = 'Registra movimientos para medir cuánto respetas tu plan'; }
  else {
    const ok = withBudget.filter(c => catStatus(ctx, c, mk).state !== 'over').length;
    adh = 15 * ok / withBudget.length;
    adhDetail = _t`${ok} de ${withBudget.length} ${tn(withBudget.length, 'categoría', 'categorías')} dentro del presupuesto este mes`;
  }
  parts.push({ key: 'plan', label: 'Respeto al plan', max: 15, score: adh, detail: adhDetail });
  parts.push({ key: 'inversion', label: 'Inversión', max: 15, score: 15 * clamp((invB / I) / 0.10, 0, 1), detail: _t`${Math.round(invB / I * 100)}% del ingreso a inversión (meta: 10% o más)` });
  const score = Math.round(sum(parts, p => p.score));
  const label = score >= 85 ? 'Excelente' : score >= 70 ? 'Sólida' : score >= 55 ? 'En camino' : score >= 40 ? 'Frágil' : 'En riesgo';
  const weakest = [...parts].sort((a, b) => a.score / a.max - b.score / b.max)[0];
  return { score, label, parts, weakest };
}

/* ---------- Optimizador de presupuesto ---------- */
const PHASES = {
  A: { n: 1, name: 'Colchón inicial', text: 'Primero, un mes de gastos esenciales guardado. Es lo que evita que una emergencia se convierta en deuda.' },
  B: { n: 2, name: 'Eliminar deuda cara', text: 'Tienes deudas con intereses altos. Cada peso extra que les pagas te rinde exactamente lo que cobra su tasa, sin riesgo.' },
  C: { n: 3, name: 'Blindaje', text: 'Completa tu fondo de emergencia mientras empiezas a invertir. Tu tranquilidad primero, tu crecimiento después.' },
  D: { n: 4, name: 'Crecimiento', text: 'Tu base está segura. Ahora el dinero trabaja para ti: inversión y metas grandes.' },
};
const SEC_W = {
  A: { ef: 0.75, debt: 0.15, goals: 0.10, inv: 0 },
  B: { ef: 0.15, debt: 0.70, goals: 0.05, inv: 0.10 },
  C: { ef: 0.55, debt: 0, goals: 0.15, inv: 0.30 },
  D: { ef: 0, debt: 0, goals: 0.30, inv: 0.70 },
};
const METHODS = {
  optimizador: 'Optimizador inteligente',
  '50-30-20': 'Regla 50/30/20',
  '70-20-10': 'Regla 70/20/10',
  'pagate-primero': 'Págate primero',
};

function niceStep(I) { return I >= 200000 ? 100 : I >= 20000 ? 50 : I >= 2000 ? 10 : 1; }

function optimize(ctx, method, params) {
  params = params || {};
  const money = params.money || (n => String(Math.round(n)));
  const st = ctx.state, mk = isMkStr(params.mk) ? params.mk : ctx.mk, I = ctx.inc.total;
  const cats = activeCats(st);
  const cur = c => budgetFor(st, c.id, mk);
  const out = { method, I, mk, warnings: [], alloc: {}, reasons: {}, buckets: {} };
  if (I <= 0) { out.error = 'Agrega al menos una fuente de ingreso para calcular tu presupuesto.'; return out; }

  const ess = cats.filter(c => c.group === 'esenciales');
  const debtCat = cats.find(c => c.group === 'deudas');
  const debts = st.debts.filter(d => Number(d.balance) > 0);
  const Dmin = debts.length ? sum(debts, d => d.minPayment) : (debtCat ? cur(debtCat) : 0);
  const E = sum(ess, cur);
  const needs = E + Dmin;
  const lifeCats = cats.filter(c => GROUP[c.group]?.life);
  const lifeFixed = sum(lifeCats.filter(c => c.fixed), cur);
  const R = I - needs;
  const ef = efStatus(ctx);
  const high = debts.filter(d => (Number(d.rate) || 0) >= HIGH_RATE);
  const highBal = sum(high, d => d.balance);
  const metaGoals = st.goals.filter(g => g.kind === 'meta');
  const gInfo = metaGoals.map(g => ({ g, info: goalInfo(ctx, g) })).filter(x => x.info.rem > 0);
  const goalNeed = sum(gInfo, x => x.info.monthly);
  const goalRem = sum(gInfo, x => x.info.rem);

  let phase = ef.F < ef.M ? 'A' : highBal > 0 ? 'B' : ef.F < ef.target - 0.5 ? 'C' : 'D';
  Object.assign(out, { needs, E, Dmin, R, phase, phaseInfo: PHASES[phase], ef, lifeFixed, highBal });

  // advertencias por referencias de peso
  for (const c of ess) {
    if (c.key && BENCH[c.key] && cur(c) > BENCH[c.key] * I) {
      out.warnings.push(_t`${nm(c)} es ${Math.round(cur(c) / I * 100)}% de tu ingreso; lo sano es hasta ${Math.round(BENCH[c.key] * 100)}%.`);
    }
  }
  if (Dmin / I > 0.20) out.warnings.push(_t`Tus pagos mínimos de deuda son ${Math.round(Dmin / I * 100)}% del ingreso; por encima de 20% la deuda limita tu plan.`);

  // Déficit
  if (R < 0) {
    out.deficit = true;
    for (const c of cats) {
      if (c.group === 'esenciales') out.alloc[c.id] = cur(c);
      else if (c.group === 'deudas') out.alloc[c.id] = Dmin;
      else out.alloc[c.id] = 0;
    }
    out.warnings.unshift(_t`Tus gastos esenciales y pagos mínimos superan tu ingreso por ${money(-R)}. El plan congela gastos de estilo de vida y ahorro hasta cerrar la brecha.`);
    if (lifeFixed > 0) out.warnings.push('Pausa o cancela suscripciones mientras estés en déficit.');
    out.buckets = { needs, life: 0, ef: 0, debt: 0, goals: 0, inv: 0 };
    out.savingsRate = 0;
    return out;
  }

  // Estilo de vida (L) y bolsa de seguridad (S)
  let L, S, forcedDebt = 0;
  if (method === '50-30-20') {
    if (needs <= 0.5 * I) { L = 0.30 * I; S = R - L; }
    else { L = R * 0.6; S = R * 0.4; out.warnings.push(_t`Tus necesidades son ${Math.round(needs / I * 100)}% del ingreso (la regla pide 50%). Se reducen gustos y ahorro en proporción.`); }
  } else if (method === '70-20-10') {
    const living = 0.70 * I;
    if (needs <= living) { L = living - needs; S = 0.20 * I; forcedDebt = 0.10 * I; }
    else { L = 0; S = R * (2 / 3); forcedDebt = R / 3; out.warnings.push(_t`Tus necesidades superan el 70% del ingreso; no queda margen para gustos con esta regla.`); }
    if (!debts.length) { S += forcedDebt; forcedDebt = 0; }
  } else if (method === 'pagate-primero') {
    const p = clamp((Number(params.pct) || 20) / 100, 0, 0.9);
    S = Math.min(p * I, R); L = R - S;
    if (S < p * I) out.warnings.push(_t`Solo alcanzas a apartar ${Math.round(S / I * 100)}% primero, no ${Math.round(p * 100)}%.`);
  } else {
    const wL = { A: 0.40, B: 0.40, C: 0.45, D: 0.50 }[phase];
    L = Math.min(wL * R, 0.30 * I);
    L = Math.max(L, Math.min(lifeFixed, R * 0.6));
    S = R - L;
  }
  L = Math.max(0, L); S = Math.max(0, S);

  // Reparto de la bolsa de seguridad con topes (water-filling)
  const allDebtBal = sum(debts, d => d.balance);
  const cap = {
    ef: ef.gap,
    debt: Math.max(0, (highBal > 0 ? highBal : 0) - forcedDebt),
    goals: gInfo.length ? (goalNeed > 0 ? goalNeed : goalRem) : 0,
    inv: Infinity,
  };
  const W = SEC_W[phase];
  const a = { ef: 0, debt: 0, goals: 0, inv: 0 };
  let rem = S;
  for (let it = 0; it < 8 && rem > 0.5; it++) {
    const act = ['ef', 'debt', 'goals', 'inv'].filter(k => W[k] > 0 && a[k] < cap[k] - 0.5);
    const ws = sum(act, k => W[k]);
    if (ws <= 0) break;
    let used = 0;
    for (const k of act) { const give = Math.min(rem * W[k] / ws, cap[k] - a[k]); a[k] += give; used += give; }
    rem -= used;
    if (used < 0.01) break;
  }
  if (rem > 0.5) {
    // Lo que sobra tras llenar topes: metas pendientes, luego inversión
    const g2 = Math.min(rem, Math.max(0, goalRem - a.goals)); a.goals += g2; rem -= g2;
    a.inv += rem; rem = 0;
  }
  a.debt += Math.min(forcedDebt, allDebtBal);
  if (forcedDebt > allDebtBal) a.inv += forcedDebt - allDebtBal;

  // Redondeo amable y cuadre exacto (base cero: cada peso con trabajo)
  const step = niceStep(I);
  const rnd = x => Math.max(0, Math.round(x / step) * step);
  const alloc = {};
  for (const c of ess) alloc[c.id] = cur(c);
  if (debtCat) alloc[debtCat.id] = round2(Dmin + rnd(a.debt));
  // estilo de vida
  const lifeFixedCats = lifeCats.filter(c => c.fixed);
  const fixScale = lifeFixed > 0 && L < lifeFixed ? L / lifeFixed : 1;
  let lifeUsed = 0;
  for (const c of lifeFixedCats) { alloc[c.id] = fixScale === 1 ? cur(c) : rnd(cur(c) * fixScale); lifeUsed += alloc[c.id]; }
  const lifeFlex = Math.max(0, L - lifeUsed);
  const w = { ...LIFE_WEIGHTS };
  if (!st.profile.hasPartner) w.pareja = 0;
  if ((Number(st.profile.dependents) || 0) > 0) w.familia = 0.28;
  const groupsPresent = Object.keys(w).filter(g => w[g] > 0 && lifeCats.some(c => c.group === g && !c.fixed));
  const wsum = sum(groupsPresent, g => w[g]);
  for (const c of lifeCats.filter(c => !c.fixed && !groupsPresent.includes(c.group))) alloc[c.id] = 0;
  for (const g of groupsPresent) {
    const gAmt = wsum > 0 ? lifeFlex * w[g] / wsum : 0;
    const gc = lifeCats.filter(c => c.group === g && !c.fixed);
    const base = sum(gc, cur);
    for (const c of gc) alloc[c.id] = rnd(base > 0 ? gAmt * cur(c) / base : gAmt / gc.length);
  }
  const efCat = cats.find(c => c.group === 'emergencia');
  const goalCat = cats.find(c => c.group === 'ahorro');
  const invCat = cats.find(c => c.group === 'inversion');
  let orphan = 0;
  if (efCat) alloc[efCat.id] = rnd(a.ef); else orphan += a.ef;
  if (goalCat) alloc[goalCat.id] = rnd(a.goals); else orphan += a.goals;
  if (invCat) alloc[invCat.id] = rnd(a.inv + orphan);
  for (const c of cats) if (!(c.id in alloc)) alloc[c.id] = 0;
  // cuadre
  let diff = round2(I - sum(Object.values(alloc)));
  if (diff > 0) {
    const sink = invCat || goalCat || efCat || lifeCats.find(c => !c.fixed);
    if (sink) alloc[sink.id] = round2(alloc[sink.id] + diff);
  } else if (diff < 0) {
    // el redondeo se pasó: se descuenta de las bolsas más grandes, nunca de esenciales
    const floor = c => (debtCat && c === debtCat ? round2(Dmin) : 0);
    const pool = [invCat, goalCat, efCat, ...lifeCats.filter(c => !c.fixed), debtCat].filter(Boolean).sort((x, y) => (alloc[y.id] - floor(y)) - (alloc[x.id] - floor(x)));
    for (const c of pool) { if (diff >= -0.001) break; const take = Math.min(Math.max(0, alloc[c.id] - floor(c)), -diff); alloc[c.id] = round2(alloc[c.id] - take); diff = round2(diff + take); }
    if (diff < -0.001) { const fx = lifeCats.filter(c => c.fixed).sort((x, y) => alloc[y.id] - alloc[x.id]); for (const c of fx) { if (diff >= -0.001) break; const take = Math.min(alloc[c.id], -diff); alloc[c.id] = round2(alloc[c.id] - take); diff = round2(diff + take); } }
  }
  out.alloc = alloc;

  const lifeTotal = sum(lifeCats, c => alloc[c.id] || 0);
  out.buckets = {
    needs: sum(ess, c => alloc[c.id]) + Dmin,
    life: lifeTotal,
    ef: efCat ? alloc[efCat.id] : 0,
    debt: debtCat ? Math.max(0, alloc[debtCat.id] - Dmin) : 0,
    goals: goalCat ? alloc[goalCat.id] : 0,
    inv: invCat ? alloc[invCat.id] : 0,
  };
  const B = out.buckets;
  out.savingsRate = (B.ef + B.goals + B.inv + B.debt) / I;

  // Razones (explicables)
  if (efCat) {
    if (ef.gap <= 0) out.reasons[efCat.id] = _t`Tu fondo de emergencia está completo (${lnum(ef.T)} meses). No necesita más aportes.`;
    else if (B.ef > 0) out.reasons[efCat.id] = _t`Faltan ${money(ef.gap)} para cubrir ${lnum(ef.T)} ${tn(ef.T, 'mes', 'meses')} de gastos esenciales. A este ritmo lo completas en ${Math.ceil(ef.gap / B.ef)} ${tn(Math.ceil(ef.gap / B.ef), 'mes', 'meses')}.`;
    else out.reasons[efCat.id] = 'En esta fase la prioridad está en otra parte.';
  }
  if (debtCat) {
    if (B.debt > 0 && debts.length) {
      const base = simulateDebts(debts, 0, 'avalancha');
      const withX = simulateDebts(debts, B.debt, 'avalancha');
      const top = [...debts].sort((x, y) => (Number(y.rate) || 0) - (Number(x.rate) || 0))[0];
      const saved = base.never ? null : Math.max(0, base.interest - withX.interest);
      out.reasons[debtCat.id] = _t`Mínimos más ${money(B.debt)} extra dirigidos a ${nm(top)} (${lnum(top.rate)}% anual).` + (saved != null && isFinite(withX.months) ? _t` Ahorras cerca de ${money(saved)} en intereses y terminas ${Math.max(0, base.months - withX.months)} meses antes.` : '');
    } else out.reasons[debtCat.id] = debts.length ? 'Pagos mínimos de tus deudas.' : 'Sin deudas registradas.';
  }
  if (goalCat) out.reasons[goalCat.id] = gInfo.length
    ? (B.goals + 0.5 >= goalNeed ? (gInfo.length === 1 ? _t`Cubre tu meta a tiempo${goalNeed > 0 ? _t` (necesita ${money(goalNeed)} al mes)` : ''}.` : _t`Cubre tus ${gInfo.length} metas a tiempo${goalNeed > 0 ? _t` (necesitan ${money(goalNeed)} al mes)` : ''}.`) : _t`Tus metas necesitan ${money(goalNeed)} al mes; aquí caben ${money(B.goals)}. Mueve alguna fecha o prioriza.`)
    : 'Crea una meta (viaje, carro, estudios) y el optimizador le asigna dinero.';
  if (invCat) out.reasons[invCat.id] = B.inv > 0 ? _t`Invertido a un 8% anual durante 20 años podría crecer a unos ${money(fvAnnuity(B.inv, 0.08, 20))}.` : 'Se activa cuando tu base esté segura.';
  out.lifeReason = _t`Dinero sin culpa: ${Math.round(lifeTotal / I * 100)}% del ingreso para disfrutar. Presupuestar el disfrute es lo que evita abandonar el plan.`;
  return out;
}

/* ---------- Alertas inteligentes ---------- */
function insights(ctx, money) {
  money = money || (n => String(Math.round(n)));
  const st = ctx.state, mk = ctx.mk, I = ctx.inc.total, out = [];
  const day = parseDate(ctx.today).getDate(), dim = daysIn(mk);
  const ms = monthSummary(ctx, mk);
  const cats = activeCats(st);
  if (I <= 0) out.push({ level: 'alerta', title: 'Falta tu ingreso', body: 'Sin ingresos registrados no hay plan posible. Agrega tus fuentes de ingreso.', act: { label: 'Agregar ingreso', act: 'income-new' } });
  const noRate = [...new Set([...(st.incomes || []), ...(st.recurring || [])].map(x => x.currency).filter(c => fxMissing(st, c)))];
  if (noRate.length) out.push({ level: 'alerta', title: _t`Falta la tasa de cambio de ${noRate.join(', ')}`, body: 'Tienes ingresos o pagos fijos en esa moneda. Sin la tasa, los totales no son correctos.', act: { label: 'Poner la tasa', go: 'ajustes' } });
  const tot = monthTotals(ctx, mk);
  if (I > 0 && tot.unassigned > Math.max(1, I * 0.01)) out.push({ level: 'aviso', title: _t`Tienes ${money(tot.unassigned)} sin asignar`, body: 'Dale un trabajo a cada peso. El dinero sin plan se gasta sin darte cuenta.', act: { label: 'Optimizar presupuesto', act: 'optim-open' } });
  if (I > 0 && tot.unassigned < -Math.max(1, I * 0.01)) out.push({ level: 'alerta', title: _t`Asignaste ${money(-tot.unassigned)} más de lo que ganas`, body: 'Tu presupuesto supera tu ingreso. Reduce categorías o usa el optimizador.', act: { label: 'Optimizar presupuesto', act: 'optim-open' } });
  const ef = efStatus(ctx);
  if (I > 0 && ef.coverage < 1) out.push({ level: 'alerta', title: 'Tu colchón cubre menos de un mes', body: _t`Tienes ${money(ef.F)} para emergencias; un mes de gastos esenciales son ${money(ef.M)}. Es la prioridad número uno.`, act: { label: 'Ver fondo', go: 'metas' } });
  // proyección de fin de mes por categoría
  if (day >= 5 && mk === ctx.mk) {
    for (const c of cats) {
      if (GROUP[c.group]?.kind !== 'gasto' || c.fixed) continue;
      const s = catStatus(ctx, c, mk);
      const base = s.budget + s.carry;
      if (base <= 0) continue;
      if (s.spent > base) out.push({ level: 'alerta', title: _t`${nm(c)}: te pasaste por ${money(s.spent - base)}`, body: 'Cubre la diferencia moviendo dinero desde otra categoría flexible para no romper el plan.', act: { label: 'Ver presupuesto', go: 'presupuesto' } });
      else {
        const proj = s.spent / day * dim;
        if (proj > base * 1.1 && s.spent > base * 0.5) out.push({ level: 'aviso', title: _t`A este ritmo, ${nm(c)} cerrará en ${money(proj)}`, body: _t`Tu presupuesto es ${money(base)}. Para llegar, gasta como máximo ${money(Math.max(0, s.avail) / Math.max(1, dim - day + 1))} por día en esto.` });
      }
    }
  }
  // anomalías vs promedio de 3 meses previos
  const prev = [mkAdd(mk, -1), mkAdd(mk, -2), mkAdd(mk, -3)].filter(m => ctx.byMonth.has(m));
  if (prev.length >= 2 && day >= 10) {
    for (const c of cats) {
      // los gastos fijos se pagan de una vez: proyectarlos por día daría falsas alarmas
      if (GROUP[c.group]?.kind !== 'gasto' || c.fixed) continue;

// Fechas razonables para escribir a mano: ni 1900 ni 2200

// Convierte TODOS los montos guardados a la nueva moneda con la tasa dada (1 moneda actual = rate moneda nueva)
function convertBase(newCur, rate) {
  const old = S.profile.currency, k = x => round2((Number(x) || 0) * rate);
  for (const i of S.incomes) { if (i.currency === old || !i.currency) { i.amount = k(i.amount); if (i.min) i.min = k(i.min); i.currency = newCur; } }
  for (const r of S.recurring) { if (r.currency === old || !r.currency) { r.amount = k(r.amount); r.currency = newCur; } }
  for (const t of S.transactions) {
    if (t.currency === newCur) t.amountBase = round2(t.amount);
    else if (t.currency === old || !t.currency) { t.amount = k(t.amount); t.amountBase = t.amount; t.currency = newCur; }
    else t.amountBase = k(t.amountBase);
  }
  for (const c of S.categories) c.budget = k(c.budget);
  for (const m of Object.keys(S.budgetHistory)) for (const id of Object.keys(S.budgetHistory[m])) S.budgetHistory[m][id] = k(S.budgetHistory[m][id]);
  for (const d of S.debts) { d.balance = k(d.balance); d.minPayment = k(d.minPayment); }
  for (const g of S.goals) { g.target = k(g.target); g.initial = k(g.initial); }
  for (const a of S.assets) a.value = k(a.value);
  for (const w of S.wishlist) w.price = k(w.price);
  for (const x of S.sans) { if (x.currency === old || !x.currency) { x.amount = k(x.amount); x.fee = k(x.fee); if (x.received) x.received.amount = k(x.received.amount); x.currency = newCur; } }
  for (const x of S.loans) { if (x.currency === old || !x.currency) { x.amount = k(x.amount); for (const p of x.payments || []) p.amount = k(p.amount); x.currency = newCur; } }

  for (const m of Object.keys(S.netWorthHistory)) S.netWorthHistory[m] = Math.round((Number(S.netWorthHistory[m]) || 0) * rate);
  const fx = {};
  for (const [c, v] of Object.entries(S.profile.fx || {})) if (c !== newCur && Number(v) > 0) fx[c] = Number(v) * rate;
  S.profile.fx = fx;
  if (S.profile.secondary === newCur) S.profile.secondary = '';
  S.profile.currency = newCur;
  nfCache.clear();
}

    let guard = 0;

      const due = r.nextDate, id = 'rec_' + r.id + '_' + due.replace(/-/g, '');
      if (!S.transactions.some(x => x.id === id)) {
        S.transactions.push(makeTx({ id, type: r.type === 'ingreso' ? 'ingreso' : 'gasto', amount: r.amount, currency: r.currency, catId: r.type === 'ingreso' ? null : r.catId, note: r.name, def: isDef(r) ? r.name : null, date: due, recurringId: r.id, sourceId: r.sourceId, createdAt: Date.UTC(+due.slice(0, 4), +due.slice(5, 7) - 1, +due.slice(8, 10)) }));

      if (last < 2) continue;

    { id: uid(), name: 'Tenis para correr', price: 4200, addedAt: addDays(t, -5), cooldownDays: 3, status: 'esperando' },

  st.assets = [
    { id: uid(), name: 'Cuenta corriente', kind: 'activo', type: 'cuenta', value: 25000 },
    { id: uid(), name: 'Carro', kind: 'activo', type: 'vehiculo', value: 650000 },
  ];

}

/* =====================================================================
   SYNC — tus datos en todos tus dispositivos
   Motor CRDT (mapa LWW con lápidas y reloj lógico híbrido): cada elemento
   guarda un sello de tiempo; al unir dos dispositivos gana el cambio más
   reciente y los borrados se respetan. La unión es conmutativa, asociativa
   e idempotente: todos los dispositivos terminan con el mismo estado sin
   importar el orden en que se sincronicen, y nadie pierde datos por
   sincronizar sin conexión.
   Backends: la cuenta de Claude (capacidad db) o tu servidor (Cloudflare
   Worker + D1) con cifrado de punta a punta: el servidor solo ve bytes.
   ===================================================================== */
'use strict';

const SYNC_COLLS = ['incomes', 'categories', 'transactions', 'goals', 'debts', 'recurring', 'wishlist', 'assets', 'sans', 'loans'];
const SYNC_REGS = ['profile', 'plan', 'settings', 'meta'];
const SYNC_SHARDS = ['s0', 's1', 's2', 's3', 's4', 's5', 's6', 's7'];
const SYNC_REC_RE = /^transactions:rec_[A-Za-z0-9-]+_(\d{4})(\d{2})(\d{2})$/;
const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

/* ---------- JSON canónico: mismo contenido → misma cadena ---------- */
function canon(v) {
  if (v === null || v === undefined || typeof v === 'function') return 'null';
  if (typeof v === 'number') return isFinite(v) ? JSON.stringify(v) : 'null';
  if (typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  const ks = Object.keys(v).filter(k => v[k] !== undefined && typeof v[k] !== 'function').sort();
  return '{' + ks.map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}

/* ---------- estado ⇄ mapa plano de elementos ---------- */
function syncFlatten(st) {
  const f = new Map();
  for (const c of SYNC_COLLS) for (const e of st[c] || []) if (e && e.id) f.set(c + ':' + e.id, e);
  for (const r of SYNC_REGS) if (st[r] && typeof st[r] === 'object') f.set(r, st[r]);
  const cp = { ...(st.couple || {}) };
  const settl = Array.isArray(cp.settlements) ? cp.settlements : [];
  delete cp.settlements;
  f.set('couple', cp);
  for (const s of settl) f.set('st:' + fnv1a(canon(s)).toString(36), s);
  f.set('top', { onboarded: st.onboarded === true, createdAt: st.createdAt || null });
  for (const mk of Object.keys(st.budgetHistory || {})) {
    f.set('bhm:' + mk, 1);
    const snap = st.budgetHistory[mk] || {};
    for (const id of Object.keys(snap)) f.set('bh:' + mk + ':' + id, snap[id]);
  }
  for (const mk of Object.keys(st.netWorthHistory || {})) f.set('nw:' + mk, st.netWorthHistory[mk]);
  return f;
}
function syncUnflatten(rep) {
  const st = { budgetHistory: {}, netWorthHistory: {}, couple: {} };
  const ents = {};
  for (const c of SYNC_COLLS) ents[c] = [];
  const settl = [];
  for (const k of [...rep.f.keys()].sort(cmpStr)) {
    const v = rep.f.get(k), i = k.indexOf(':'), pre = i < 0 ? k : k.slice(0, i);
    if (ents[pre]) ents[pre].push(k);
    else if (pre === 'bhm') { const mk = k.slice(4); if (!st.budgetHistory[mk]) st.budgetHistory[mk] = {}; }
    else if (pre === 'bh') { const mk = k.slice(3, 10); (st.budgetHistory[mk] = st.budgetHistory[mk] || {})[k.slice(11)] = v; }
    else if (pre === 'nw') st.netWorthHistory[k.slice(3)] = v;
    else if (pre === 'st') settl.push(v);
    else if (pre === 'top') { st.onboarded = !!(v && v.onboarded === true); st.createdAt = v ? v.createdAt : null; }
    else if (pre === 'couple') st.couple = { ...(v || {}) };
    else if (SYNC_REGS.includes(pre)) st[pre] = v;
  }
  const ord = k => rep.c[k] || Number.MAX_SAFE_INTEGER;
  for (const c of SYNC_COLLS) st[c] = ents[c].sort((a, b) => ord(a) - ord(b) || cmpStr(a, b)).map(k => rep.f.get(k));
  st.couple.settlements = settl.sort((a, b) => cmpStr(String(a && a.date), String(b && b.date)) || cmpStr(canon(a), canon(b)));
  st.sync = { hlc: rep.hlc, u: { ...rep.u }, c: { ...rep.c }, dead: { ...rep.dead } };
  return st;
}
function syncRep(st) {
  const sy = st.sync || {};
  return { f: syncFlatten(st), u: { ...(sy.u || {}) }, c: { ...(sy.c || {}) }, dead: { ...(sy.dead || {}) }, hlc: Number(sy.hlc) || 0 };
}
function syncCanonMap(f) { const m = new Map(); for (const [k, v] of f) m.set(k, canon(v)); return m; }

/* ---------- unión (función pura, conmutativa, asociativa, idempotente) ---------- */
function syncMerge(A, B) {
  const keys = new Set([...A.f.keys(), ...B.f.keys(), ...Object.keys(A.dead), ...Object.keys(B.dead)]);
  const f = new Map(), u = {}, c = {}, dead = {};
  let hlc = Math.max(A.hlc || 0, B.hlc || 0);
  for (const k of keys) {
    let has = false, v, t = 0;
    if (A.f.has(k)) { has = true; v = A.f.get(k); t = A.u[k] || 0; }
    if (B.f.has(k)) {
      const vb = B.f.get(k), tb = B.u[k] || 0;
      if (!has || tb > t || (tb === t && canon(vb) > canon(v))) { v = vb; t = tb; }
      has = true;
    }
    const tomb = Math.max(A.dead[k] || 0, B.dead[k] || 0);
    if (has && (tomb === 0 || t > tomb)) {
      f.set(k, v);
      if (t) u[k] = t;
      const ca = A.c[k] || 0, cb = B.c[k] || 0;
      if (ca || cb) c[k] = ca && cb ? Math.min(ca, cb) : ca || cb;
      if (t > hlc) hlc = t;
    } else if (tomb) { dead[k] = tomb; if (tomb > hlc) hlc = tomb; }
  }
  return { f, u, c, dead, hlc };
}

/* ---------- sellos: detecta qué cambió desde la última vez y lo marca ---------- */
function syncStamp(st, base, now) {
  const sy = st.sync;
  const tick = () => (sy.hlc = Math.max(now ? now() : Date.now(), (Number(sy.hlc) || 0) + 1));
  const cur = new Map();
  for (const [k, v] of syncFlatten(st)) {
    const cs = canon(v);
    cur.set(k, cs);
    if (base.get(k) !== cs || !sy.u[k]) {
      const m = !base.has(k) && !sy.u[k] ? SYNC_REC_RE.exec(k) : null;
      // un pago fijo automático nace con el sello de su fecha: si otro dispositivo ya lo borró, no revive
      const t = m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) - 14 * 3600000 : tick();
      sy.u[k] = t;
      if (!sy.c[k]) sy.c[k] = t;
      delete sy.dead[k];
    }
  }
  for (const k of base.keys()) if (!cur.has(k)) { sy.dead[k] = tick(); delete sy.u[k]; delete sy.c[k]; }
  return cur;
}

/* ---------- fragmentos (8 documentos pequeños en vez de uno gigante) ---------- */
const syncShardOf = k => SYNC_SHARDS[fnv1a(k) % SYNC_SHARDS.length];
function syncPack(rep) {
  const out = {};
  for (const s of SYNC_SHARDS) out[s] = { e: {}, d: {} };
  for (const [k, v] of rep.f) out[syncShardOf(k)].e[k] = [v, rep.u[k] || 0, rep.c[k] || 0];
  for (const k of Object.keys(rep.dead)) out[syncShardOf(k)].d[k] = rep.dead[k];
  return out;
}
function syncUnpack(shards) {
  const rep = { f: new Map(), u: {}, c: {}, dead: {}, hlc: 0 };
  for (const s of Object.keys(shards || {})) {
    const o = shards[s];
    if (!o || typeof o !== 'object') continue;
    for (const [k, t] of Object.entries(o.e && typeof o.e === 'object' ? o.e : {})) {
      if (!Array.isArray(t) || typeof k !== 'string' || k.length > 300) continue;
      rep.f.set(k, t[0]);
      const u = Number(t[1]) || 0, c = Number(t[2]) || 0;
      if (u > 0) { rep.u[k] = u; if (u > rep.hlc) rep.hlc = u; }
      if (c > 0) rep.c[k] = c;
    }
    for (const [k, t] of Object.entries(o.d && typeof o.d === 'object' ? o.d : {})) {
      const n = Number(t) || 0;
      if (n > 0 && k.length <= 300) { rep.dead[k] = n; if (n > rep.hlc) rep.hlc = n; }
    }
  }
  return rep;
}
const syncHasData = rep => { const t = rep.f.get('top'); return !!(t && t.onboarded === true); };
const syncCount = (rep, coll) => { let n = 0; for (const k of rep.f.keys()) if (k.startsWith(coll + ':')) n++; return n; };
// "Usar los datos de este dispositivo": sellos nuevos para todo lo local y lápidas para lo que solo existe allá
function syncAuthoritative(local, remote, now) {
  const rep = { f: new Map(local.f), u: {}, c: { ...local.c }, dead: {}, hlc: Math.max(local.hlc, remote.hlc) };
  const tick = () => (rep.hlc = Math.max(now ? now() : Date.now(), rep.hlc + 1));
  for (const k of rep.f.keys()) { rep.u[k] = tick(); if (!rep.c[k]) rep.c[k] = rep.u[k]; }
  for (const k of new Set([...remote.f.keys(), ...Object.keys(remote.dead)])) if (!rep.f.has(k)) rep.dead[k] = tick();
  return rep;
}

/* ---------- compresión, cifrado y códigos ---------- */
const SYNC_ALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // base32 de Crockford: sin I, L, O ni U
function syncNewCode() {
  const b = crypto.getRandomValues(new Uint8Array(20));

  for (let i = 0; i < 20; i++) s += SYNC_ALPHA[b[i] & 31];
  return s.match(/.{5}/g).join('-');
}
function syncNormCode(v) {

  return t.length === 20 && [...t].every(ch => SYNC_ALPHA.includes(ch)) ? t.match(/.{5}/g).join('-') : null;
}
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

async function gzBytes(str) {
  const raw = new TextEncoder().encode(str);
  if (typeof CompressionStream === 'undefined') return { flag: 106, bytes: raw }; // 'j'
  const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
  return { flag: 122, bytes: new Uint8Array(buf) }; // 'z'
}
async function gunzipBytes(flag, bytes) {

/* ---------- backends ---------- */
function claudeBackend(db, col) {
  const ref = s => db.doc(col + '/norte-' + s);
  const pushed = {};
  let unsub = null;
  return {
    kind: 'claude', limit: 250000,
    async pull() {
      const qs = await db.collection(col).get();
      const out = {};
      for (const d of qs.docs) {
        const s = String(d.id).replace(/^norte-/, '');
        const body = d.exists ? d.data() : null;
        if (SYNC_SHARDS.includes(s) && body && typeof body.data === 'string') out[s] = body.data;
      }
      return out;
    },
    async push(s, payload) { await ref(s).set({ v: 1, data: payload }); pushed[s] = payload; },
    async wipe() { for (const s of SYNC_SHARDS) { await ref(s).delete(); delete pushed[s]; } },
    watch(cb) {
      if (unsub) return;
      try {
        unsub = db.collection(col).onSnapshot(qs => {
          if (qs.metadata && qs.metadata.hasPendingWrites) return;
          const changed = qs.docChanges().some(ch => { const s = String(ch.doc.id).replace(/^norte-/, ''); const b = ch.doc.data(); return !b || b.data !== pushed[s]; });
          if (changed) cb();
        }, () => { unsub = null; });
      } catch (e) { unsub = null; }
    },
    encode: s => syncGz(s), decode: s => syncUngz(s),
  };
}
async function serverBackend(code) {
  const { id, key } = await syncKeys(code);
  const base = CONFIG.SYNC_API_URL.replace(/\/+$/, '') + '/' + id;
  let revs = {};
  const hdr = () => { const h = { 'Content-Type': 'application/json' }; if (S && S.plan && S.plan.license) h['X-Norte-License'] = S.plan.license; return h; };
  const call = async (url, opt) => { try { return await fetch(url, { cache: 'no-store', ...opt, headers: hdr() }); } catch (e) { throw { code: 'offline' }; } };
  return {
    kind: 'code', limit: 900000, id,
    async pull() {
      const r = await call(base);
      if (!r.ok) throw { code: r.status === 402 || r.status === 403 ? 'license' : 'http', status: r.status };
      const j = await r.json();
      const out = {};
      revs = {};
      for (const [s, row] of Object.entries(j.shards || {})) if (SYNC_SHARDS.includes(s) && row && typeof row.data === 'string') { revs[s] = row.rev | 0; out[s] = row.data; }
      return out;
    },
    async push(s, payload) {
      const r = await call(base + '/' + s, { method: 'PUT', body: JSON.stringify({ rev: revs[s] || 0, data: payload }) });
      if (r.status === 409) { const j = await r.json().catch(() => ({})); revs[s] = j.rev | 0; throw { code: 'conflict' }; }
      if (!r.ok) throw { code: r.status === 402 || r.status === 403 ? 'license' : r.status === 413 ? 'too_big' : 'http', status: r.status };
      revs[s] = (await r.json()).rev | 0;
    },
    async wipe() { const r = await call(base, { method: 'DELETE' }); if (!r.ok) throw { code: 'http', status: r.status }; revs = {}; },
    encode: s => syncSeal(key, s), decode: s => syncOpen(key, s),
  };
}

/* ---------- controlador ---------- */
const Sync = {
  kind: 'none', status: 'off', msg: '', lastAt: 0, backend: null, base: new Map(),
  running: false, again: false, timer: null, pending: null, started: false,
  cfg: { claude: true, code: '', joined: false },
  cfgKey() { return CONFIG.STORAGE_KEY + '.sync'; },
  loadCfg() { try { const v = JSON.parse(localStorage.getItem(this.cfgKey()) || '{}'); if (v && typeof v === 'object') Object.assign(this.cfg, { claude: v.claude !== false, code: syncNormCode(v.code) || '', joined: v.joined === true }); } catch (e) { /* sin almacenamiento */ } },
  saveCfg() { try { localStorage.setItem(this.cfgKey(), JSON.stringify(this.cfg)); } catch (e) { /* sin almacenamiento */ } },
  init() { this.base = syncCanonMap(syncFlatten(S)); },
  stamp() {
    if (!S || !S.onboarded || UI.fatal) return;
    if (!this.backend && !CONFIG.SYNC_API_URL) return; // sin sincronización posible no se sella nada (no engorda los datos)
    if (!S.sync || typeof S.sync !== 'object') S.sync = { hlc: 0, u: {}, c: {}, dead: {} };
    this.base = syncStamp(S, this.base);
  },
  demo() { return !!(S && S.meta && S.meta.demo); },
  on() { return !!this.backend && ['connecting', 'ok', 'offline', 'error', 'choose'].includes(this.status); },
  touched() { if (this.on() && this.status !== 'choose') this.schedule(1500); },
  schedule(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  async start() {
    if (this.started) return;
    this.started = true;
    this.loadCfg();
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      try {
        const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
        const uid = db && user && typeof user.id === 'function' ? await user.id() : null;
        if (db && uid) { this.kind = 'claude'; this.backend = claudeBackend(db, 'data/users/' + uid); }
      } catch (e) { this.backend = null; }
    }
    if (!this.backend && CONFIG.SYNC_API_URL) {
      this.kind = 'code';
      if (this.cfg.code) { try { this.backend = await serverBackend(this.cfg.code); } catch (e) { this.backend = null; this.status = 'error'; this.msg = 'Este navegador no permite cifrar datos.'; } }
    }
    window.addEventListener('online', () => { if (this.on()) this.schedule(300); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && this.on()) this.schedule(400); });
    setInterval(() => { if (document.visibilityState === 'visible' && this.on() && this.kind === 'code') this.schedule(0); }, 45000);

  },

    if (this.backend.watch) this.backend.watch(() => this.schedule(300));
    scheduleRender();
    this.run();
  },
  errText(e) {
    const c = e && e.code;
    if (c === 'license') return 'La sincronización es parte de Pro. Revisa tu licencia.';
    if (c === 'too_big' || c === 'invalid_argument') return 'Tus datos son demasiado grandes para sincronizar. Descarga una copia de seguridad.';
    if (c === 'quota_exceeded') return 'No hay espacio para más datos sincronizados.';
    if (c === 'key') return 'Ese código no abre estos datos. Revisa el código.';
    if (c === 'nogzip') return 'Este navegador es muy viejo para sincronizar. Actualízalo.';

    if (this.kind === 'code' && S.onboarded && !isPro()) { this.status = 'error'; this.msg = 'La sincronización es parte de Pro.'; scheduleRender(); return; }
    if (this.running) { this.again = true; return; }
    this.running = true;

    try {

      const shards = {};
      for (const s of Object.keys(raw)) shards[s] = JSON.parse(await this.backend.decode(raw[s]));

      if (this.demo() || UI.fatal) return;
      const local = syncRep(S);

/* ---------- Inicio ---------- */
function vInicio(ctx) {

  const hidden = all.length - shown.length;
  const over = sts.flexBudget > 0 && sts.today < -0.5;
  let note;
  if (sts.flexBudget <= 0) note = 'Asigna presupuesto a tus gastos flexibles (comida, salidas, personal…) para calcular tu disponible diario.';
  else if (over) note = _t`Hoy van ${fmt(sts.spentToday)} en gastos flexibles, ${fmt(-sts.today)} por encima de tu ritmo. Mañana tu diario baja a ${fmt(sts.tomorrow)}.`;
  else if (sts.net < 0) note = _t`Te pasaste ${fmt(-sts.net)} en gastos flexibles este mes. Cubre la diferencia desde otra categoría.`;
  else note = _t`Te quedan ${fmt(sts.net)} en gastos flexibles para ${sts.left} ${tn(sts.left, 'día', 'días')}. Lo que no gastes hoy sube tu disponible de mañana.`;

  const recent = (ctx.byMonth.get(ctx.mk) || []).slice(0, 5);
  const isOver = over || (sts.flexBudget > 0 && sts.net < 0);
  // en Inicio caben dos alertas; el resto se despliega
  const top2 = UI.insAll ? shown : shown.slice(0, 2), more = shown.length - 2;

  return _t`<div class="stack-l">
  <div class="page-h"><div><h1>${esc(greeting())}${S.profile.name ? _t`, ${esc(mark(S.profile.name))}` : ''}</h1><p>${ms.count ? _t`Llevas ${ms.count} ${tn(ms.count, 'movimiento', 'movimientos')} este mes.` : S.transactions.length ? 'Todavía no hay movimientos este mes. Registra el primero con el botón +.' : 'Registra tu primer gasto con el botón + y el plan empieza a trabajar.'}</p></div></div>
  ${backupReminder()}

  <section class="bill ${isOver ? 'over' : ''}" aria-label="Disponible para hoy">
    ${guilloche()}
    <div class="bill-top"><span>Puedes gastar hoy</span>${isOver ? _t`<span class="stamp">Excedido</span>` : ''}</div>
    <p class="bill-amount">${esc(over ? '−' + fmt(-sts.today) : fmt(Math.max(0, sts.today)))}</p>
    <p class="bill-note" style="max-width:min(44ch,calc(100% - 84px))">${esc(note)}</p>
    <div class="bill-foot" style="padding-right:84px"><span>Flexible restante: <b class="num">${esc(fmt(sts.net))}</b></span><span>Diario de mañana: <b class="num">${esc(fmt(sts.tomorrow))}</b></span></div>
    ${svgMonthSeal(sts.day, sts.dim)}
  </section>

  <div class="statline" role="group" aria-label="Resumen del mes">
    <div><span class="k">Ingresos</span><span class="v num pos">${esc(fmt(ms.income))}</span></div>
    <div><span class="k">Gastado</span><span class="v num">${esc(fmt(ms.spent))}</span></div>
    <div><span class="k">Ahorrado</span><span class="v num">${esc(fmt(ms.saved))}</span></div>
  </div>

  <section class="panel flush" aria-labelledby="h-ins"><div class="panel-h" style="padding:1rem 1rem 0"><h2 id="h-ins">Lo que importa ahora</h2></div>
    ${top2.length ? top2.map(insightHtml).join('') : emptyBox('Todo en orden', 'Sin alertas por ahora. Sigue registrando para que el análisis sea más preciso.')}
    ${more > 0 ? _t`<div style="padding:.2rem 1rem;border-top:1px solid var(--line)"><button class="linkbtn" data-act="ins-toggle" aria-expanded="${!!UI.insAll}">${UI.insAll ? 'Ver menos' : _t`Ver ${more} más`}</button></div>` : ''}
    ${hidden > 0 ? _t`<div style="padding:.2rem 1rem;border-top:1px solid var(--line)"><button class="linkbtn" data-act="paywall" data-f="insights">Ver ${hidden} ${tn(hidden, 'alerta', 'alertas')} más con Pro</button></div>` : ''}
  </section>

    : emptyBox('Falta tu ingreso', 'Agrega tus ingresos para calcular tu puntuación.', _t`<button class="btn small" data-act="income-new">Agregar ingreso</button>`)}
  </section>` : ''}

  ${up.length || upPeople.length ? _t`<section class="panel flush" aria-labelledby="h-up"><div class="panel-h" style="padding:1rem 1rem 0"><h2 id="h-up">Próximos pagos</h2><a class="small" href="#/fijos">Ver todos</a></div>
    <ul class="list">${up.map(r => { const d = diffDays(ctx.today, r.nextDate); return _t`<li><span class="dot" style="background:${r.type === 'ingreso' ? 'var(--billete)' : catColor(ctx, r.catId)}"></span><div class="grow"><div class="t">${esc(nm(r))}</div><div class="s">${d < 0 ? _t`Vencido hace ${-d} ${tn(-d, 'día', 'días')}` : d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : _t`En ${d} días`}${r.auto ? ', se registra solo' : ''}</div></div><span class="amt ${r.type === 'ingreso' ? 'pos' : ''}">${M(toBase(S, r.amount, r.currency))}</span>${r.auto ? '' : _t`<button class="btn small soft" data-act="rec-post" data-id="${r.id}">Registrar</button>`}</li>`; }).join('')}${upPeople.map(x => _t`<li><span class="dot" style="background:${x.kind === 'san' ? 'var(--g-ahorro)' : 'var(--g-deudas)'}"></span><div class="grow"><div class="t">${esc(x.kind === 'san' ? nm(x.o) : mark(x.name))}</div><div class="s">${whenTxt(diffDays(ctx.today, x.date))}, ${x.kind === 'san' ? 'aporte del san' : 'préstamo por pagar'}</div></div><span class="amt">${M(x.amount)}</span>${x.kind === 'san' ? _t`<button class="btn small soft" data-act="san-pay" data-id="${x.id}">Registrar</button>` : _t`<a class="btn small ghost" href="#/san">Ver</a>`}</li>`).join('')}</ul>
  </section>` : ''}
  </div>`;
}

function insightHtml(i) {
  const act = i.act ? (i.act.go ? _t`<a class="btn small ghost" href="#/${i.act.go}">${esc(i.act.label)}</a>` : _t`<button class="btn small ghost" data-act="${i.act.act}">${esc(i.act.label)}</button>`) : '';

// Aportes, retiros y pagos de deuda no guardan nota: su título sale de los datos, así cambia con el idioma
function txAuto(t) {
  if (t.sanId) { const sn = findById(S.sans, t.sanId); if (sn) return { key: t.sanK === 'w' ? 'San recibido: {0}' : 'Aporte al san: {0}', o: sn }; }
  if (t.debtId) { const d = findById(S.debts, t.debtId); if (d) return { key: 'Pago: {0}', o: d }; }
  if (t.type === 'ahorro' && t.goalId) { const g = findById(S.goals, t.goalId); if (g) return { key: t.amount < 0 ? 'Retiro de {0}' : 'Aporte a {0}', o: g }; }
  return null;
}
// notas automáticas que versiones anteriores guardaron como texto, en cualquiera de los idiomas
function isLegacyAuto(t, a) {
  if (!t.note || !a) return false;
  for (const lg of I18N_LANGS) {
    const dd = L[lg], pat = (dd && dd.get(a.key)) || a.key;
    for (const n of [a.o.name, (dd && dd.get(a.o.name)) || a.o.name]) if (t.note === pat.replace('{0}', n)) return true;
  }
  return false;
}
function txNoteRaw(t) {
  const a = txAuto(t);
  if (a && (!t.note || isLegacyAuto(t, a))) return tr(a.key, { 0: nmRaw(a.o) });
  return noteRaw(t);
}
function txTitleRaw(ctx, t) { return txNoteRaw(t) || (t.type === 'ingreso' ? tr('Ingreso') : unmark(catName(ctx, t.catId))); }
function settleText(s) {
  if (s.net == null) return mark(s.text);
  const n = s.name ? mark(s.name) : '';
  return Math.abs(s.net) < 1 ? tr('A mano') : s.net > 0 ? (n ? _t`${n} pagó ${fmt(s.net)}` : _t`Tu pareja pagó ${fmt(s.net)}`) : _t`Pagaste ${fmt(-s.net)} a ${n || 'tu pareja'}`;
}
function txRowHtml(ctx, t) {
  const isInc = t.type === 'ingreso', isSave = t.type === 'ahorro';
  const eff = txEffective(ctx, t);
  const title = mark(txTitleRaw(ctx, t));
  const sub = [tr(isInc ? 'Ingreso' : catName(ctx, t.catId))];
  if (t.shared) sub.push(_t`compartido${t.paidBy === 'pareja' ? _t`, pagó ${S.couple.partnerName || 'tu pareja'}` : ''}`);
  if (t.currency && t.currency !== S.profile.currency) sub.push(fmt(t.amount, t.currency));
  if (t.recurringId) sub.push(tr('pago fijo'));
  const sign = isInc ? '+' : isSave ? (t.amount < 0 ? '↩ ' : '→ ') : '−';
  const cls = isInc ? 'pos' : isSave ? 'warn' : '';
  const color = isInc ? 'var(--billete)' : isSave ? GROUP.ahorro.color : catColor(ctx, t.catId);
  return _t`<li class="${UI.flashId === t.id ? 'flash' : ''}"><button class="rowbtn" data-act="tx-edit" data-id="${t.id}" aria-label="Editar ${esc(title)}"><span class="dot" style="background:${color}"></span><div class="grow"><div class="t">${esc(title)}</div><div class="s">${esc(sub.join(', '))}</div></div><span class="amt ${cls}">${esc(sign)}${M(Math.abs(eff))}</span></button></li>`;
}

/* ---------- Movimientos ---------- */
// Solo la lista filtrada: al buscar se repinta esto, no la pantalla entera
function txResultsHtml(ctx) {
  const mk = UI.month;
  const f = UI.filter;
  // al buscar se revisan todos los meses: lo que se busca casi nunca está en el mes abierto
  const allMonths = !!normTxt(f.q);
  let txs = allMonths ? ctx.state.transactions.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0)) : ctx.byMonth.get(mk) || [];
  if (f.type === 'compartidos') txs = txs.filter(t => t.shared);
  else if (f.type !== 'todos') txs = txs.filter(t => t.type === f.type);
  if (f.cat) txs = txs.filter(t => t.catId === f.cat);
  if (f.q) { const q = normTxt(f.q); txs = txs.filter(t => normTxt(t.note + ' ' + txTitleRaw(ctx, t) + ' ' + catName(ctx, t.catId)).includes(q)); }
  const LIMIT = 250;
  const list = UI.showAll ? txs : txs.slice(0, LIMIT);
  let html = '', lastDay = '';
  for (const t of list) {
    if (t.date !== lastDay) {
      if (lastDay) html += '</ul>';
      const dayTot = sum(txs.filter(x => x.date === t.date && x.type === 'gasto'), x => txEffective(ctx, x));
      html += _t`<div class="day-h"><span>${esc(allMonths && t.date.slice(0, 7) !== ctx.mk ? shortDate(t.date) : dayLabel(t.date))}</span><span class="num">${dayTot ? '−' + esc(fmt(dayTot)) : ''}</span></div><ul class="list">`;
      lastDay = t.date;
    }
    html += txRowHtml(ctx, t);
  }
  if (lastDay) html += '</ul>';
  const filtered = allMonths ? S.transactions.length : (f.cat || f.type !== 'todos') && (ctx.byMonth.get(mk) || []).length;
  return _t`${allMonths ? _t`<p class="small muted search-scope">Buscando en todos los meses: ${txs.length} ${tn(txs.length, 'resultado', 'resultados')}</p>` : ''}<section class="panel flush">${list.length ? html : emptyBox(filtered ? 'Sin resultados' : 'Sin movimientos en este mes', filtered ? 'Prueba con otra búsqueda o quita los filtros.' : 'Registra un gasto, ingreso o aporte con el botón +.', _t`<button class="btn" data-act="tx-new">Registrar movimiento</button>`)}</section>
    ${txs.length > LIMIT && !UI.showAll ? _t`<button class="btn ghost block" data-act="show-all">Mostrar los ${txs.length} movimientos</button>` : ''}`;
}
